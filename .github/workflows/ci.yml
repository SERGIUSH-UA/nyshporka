name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Явно, а не дефолт репозиторію: CI лише читає, і сторонній action у ньому не
# має діставати права на запис.
permissions:
  contents: read

jobs:
  # 🔒 Ворота проти приватних даних ідуть ОКРЕМИМ і ПЕРШИМ джобом.
  # Разом із тестами вони губились би у виводі, а це єдина перевірка, ціна
  # пропуску якої незворотна: опубліковану історію git уже не «прибрати».
  private-data:
    name: приватні дані
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # історія цілком — саме її і перевіряємо
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: робоче дерево
        run: python tools/scan_private.py
      - name: уся історія
        run: python tools/scan_private.py --history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 🔴 Три версії, а не одна: 3.12-only API (напр. `os.listdrives`)
        # проходить непоміченим на машині розробника й падає в користувача.
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # Windows — основна платформа аудиторії (архівні скани, junction'и),
          # тож вона перевіряється хоча б на одній версії.
          - python: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      # 🔴 Python ПЕРЕД setup-uv. Ключ кешу uv містить версію Python, яку
      # setup-uv бачить у мить свого кроку. Коли він стояв першим, бачив
      # системний Python раннера (3.12.3), тож три матричні джоби рахували
      # один ключ, писали кеш одночасно й ділили його між 3.11, 3.12 і 3.13.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # ⚠ Точний тег, а не `@v10`: з v8 setup-uv не публікує мажорних тегів, і
      # `@v10` просто не резолвиться. Оновлювати — номером повністю.
      # 🔴 `python-version` обов'язковий. У репо закомічено `.python-version`
      # (3.12), і uv вибирає інтерпретатор за ним, а не за setup-python: джоби
      # py3.11 і py3.13 мовчки ставили й тестували все на системному 3.12.3
      # раннера — матриця не перевіряла нічого з того, заради чого існує.
      # Цей вхід ставить `UV_PYTHON`, старший за `.python-version`.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # `--locked`: інакше `uv.lock` нічого не гарантує — при розбіжності uv
      # мовчки перерозв'язує, і CI зелений на не тих версіях, що в локу.
      - name: встановити
        run: uv sync --locked --group dev
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy
      # 🔴 Згенероване з `brand.yaml` протухає ТИХО: кольори правлять у джерелі,
      # забувають перезібрати — і фронт із сайтом лишаються зі старою палітрою.
      # Ловиться лише звіркою, і дешевше тут, ніж очима поряд.
      - name: айдентика не протухла
        run: uv run python -m nyshporka.brand.gen --check
      - name: pytest
        run: uv run pytest

  installable:
    name: ставиться з нуля
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Приймач кроку «скелет»: чисте середовище, установка з коліс, робочий
      # консольний скрипт. Не `import`, а саме запуск — пакет, у якому імпорт
      # проходить, але `nysh` не стартує, для користувача не існує.
      - name: pip install у чистий venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install .
          /tmp/clean/bin/nysh version
          /tmp/clean/bin/nysh info
      # 🔴 Дані пакета мусять доїхати ВСЕРЕДИНІ колеса, а не лише лежати в репо.
      # Правило `data/` у .gitignore одного разу вже з'їло `archives.yaml`:
      # локально й у тестах усе працює (файл на диску), ламається рівно в
      # користувача. Перевіряється саме ВСТАНОВЛЕНА копія, поза деревом коду.
      - name: дані пакета доїхали в колесо
        run: |
          cd /tmp
          /tmp/clean/bin/python -c "
          from nyshporka.archives import active
          p = active()
          assert p.repo_label('DAHMO') == 'ДАХмО', p.repositories
          assert p.opys_in_key('ANRM', '211')
          print('пак прочитано зі встановленого пакета:', len(p.fonds), 'фондів')
          "
