# Рушії читання на Mac з процесором Intel (issue #10).
#
# 🔴 Окремий workflow, а не job у `ci.yml`: тут ставиться справжнє середовище
# рушіїв — pytorch з conda-forge, kraken 7.0.2, strhub — це хвилини й сотні
# мегабайт, і на кожен пуш воно не потрібне. Запускається руками або коли
# міняється те, що це середовище збирає. ⚠ Intel-раннери GitHub: `macos-15-intel`
# і `macos-26-intel` (`macos-13` знято у 2026 — job на ньому висів у черзі без
# раннера). Коли знімуть і ці, job перестане стартувати, і це буде видно тут.
name: Intel Mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/nyshporka/htr/env.py
      - src/nyshporka/htr/manifest.py
      - src/nyshporka/htr/data/engines.yaml
      - .github/workflows/intel-mac.yml

jobs:
  engines:
    name: рушії з conda-forge · macos-15-intel (x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      NYSHPORKA_WORKSPACE: ${{ github.workspace }}/ws
    steps:
      - uses: actions/checkout@v7
      # Точний тег: з v8 setup-uv не публікує мажорних тегів (`@v10` не резолвиться).
      - uses: astral-sh/setup-uv@v10.1.0
      - name: це справді x86_64
        run: uv run --no-project python -c "import platform, sys; print(sys.platform, platform.machine()); assert platform.machine() == 'x86_64'"
      - name: застосунок
        run: uv sync --locked
      - name: простір
        run: uv run nysh init --yes --preset researcher
      - name: середовище рушіїв
        run: uv run nysh htr install --no-cuda
      - name: що вийшло
        run: |
          uv run nysh htr env
          uv run nysh doctor
