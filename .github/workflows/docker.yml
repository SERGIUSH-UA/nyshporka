name: Docker

# Образ Нишпорки на GHCR: застосунок, рушії читання й ваги — для того, хто не
# хоче ставити її на основну систему.
#
# 🔴 Збирається з PyPI, а не з дерева: в образі має бути рівно те колесо, яке
# ставлять люди. Тому на тег workflow спершу чекає, доки `release.yml`
# опублікує версію, а з кнопки збирає будь-яку вже опубліковану.
#
# Теги образу:
#   <ver>, latest            — процесор, amd64 + arm64 (зокрема Mac на M-чипі)
#   <ver>-cuda, cuda         — NVIDIA, torch cu126 (compute capability 7.0–8.9)
#   <ver>-cuda128, cuda128   — NVIDIA, torch cu128 (9.0+: RTX 50xx, H100)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "версія з PyPI, напр. 0.21.1"
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sergiush-ua/nyshporka

jobs:
  build:
    name: ${{ matrix.variant }} · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Нативні раннери, без QEMU: під емуляцією збірка рушіїв і пробне
          # читання на arm64 тягнулись би годинами.
          # `cache` — рухомий тег попереднього образу цього варіанта: з нього
          # збірка бере незмінні шари (див. крок «збірка»).
          - {variant: cpu, torch: cpu, arch: amd64, runner: ubuntu-latest, cache: cpu-amd64}
          - {variant: cpu, torch: cpu, arch: arm64, runner: ubuntu-24.04-arm, cache: cpu-arm64}
          - {variant: cuda, torch: cu126, arch: amd64, runner: ubuntu-latest, cache: cuda}
          - {variant: cuda128, torch: cu128, arch: amd64, runner: ubuntu-latest, cache: cuda128}
    steps:
      - uses: actions/checkout@v7

      - name: версія
        id: ver
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # На тег колесо ще може бути в дорозі: `release.yml` публікує його після
      # воріт і збірки. Без очікування збірка впала б на `pip install`.
      - name: чекаю версію на PyPI
        run: |
          # 🔴 Простий індекс, а не JSON API: ставить `uv` саме з нього, а
          # оновлюється він пізніше. На 0.21.2 JSON уже віддав версію, а
          # збірка amd64 за мить дістала «no version of nyshporka==0.21.2».
          for i in $(seq 1 60); do
            curl -fsS -H "Cache-Control: no-cache" https://pypi.org/simple/nyshporka/ \
              | grep -q "nyshporka-${{ steps.ver.outputs.v }}-py3-none-any.whl" && exit 0
            sleep 30
          done
          echo "nyshporka ${{ steps.ver.outputs.v }} не з'явилась на PyPI за 30 хв" && exit 1

      # Образ CUDA розпакований важить ~12 ГБ, а на раннері вільно ~14.
      - name: місце на диску
        if: matrix.variant != 'cpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      # 🔴 Без кешу кожен шар, зібраний наново, отримує новий ідентифікатор,
      # навіть коли вміст той самий, — і в людини `docker pull` качає його знову.
      # Тому шари беремо з попереднього образу варіанта (inline-кеш: метадані
      # їдуть у самому образі, окремого сховища кешу на раннері не треба —
      # місця на CUDA-раннері й так впритул). Перша збірка після зміни
      # Dockerfile чи бази Python кешу не знайде й збере все — так і має бути.
      # torch — за `reference` з engines.yaml: це ключ його шару (Dockerfile).
      - name: збірка
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # sed, а не yq: на arm-раннері набір утиліт інший.
          spec=$(sed -n 's/^ *reference: *\[\(.*\)\].*/\1/p' src/nyshporka/htr/data/engines.yaml | tr -d '",')
          echo "torch для шару: $spec"
          case "$spec" in torch==*) ;; *) echo "reference в engines.yaml не прочитався: '$spec'"; exit 1;; esac
          # 🔴 Еталонного torch може не бути в індексі варіанта: PyTorch 2.14
          # не випускає cu128 (там стеля 2.11), і `uv pip install torch==2.14.0`
          # валив збірку `:cuda128` 0.29.1. Тоді шару torch немає, і torch
          # приїде з рушіями в межах kraken — як до окремого шару (0.29.0).
          want=$(echo "$spec" | tr ' ' '\n' | sed -n 's/^torch==//p')
          idx="https://download.pytorch.org/whl/${{ matrix.torch }}/torch/"
          # Сторінка — змінною: `curl | grep -q` під pipefail дає curl (23) і хибний пропуск.
          page=$(curl -fsS "$idx")
          if ! grep -qE "torch-${want}(\+|%2B)${{ matrix.torch }}-" <<<"$page"; then
            echo "::warning::torch $want немає в $idx — шар torch пропущено"
            spec=""
          fi
          DOCKER_BUILDKIT=1 docker build -f docker/Dockerfile \
            --build-arg NYSH_VERSION=${{ steps.ver.outputs.v }} \
            --build-arg TORCH=${{ matrix.torch }} \
            --build-arg "TORCH_SPEC=$spec" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from "$IMAGE:${{ matrix.cache }}" \
            -t local/nyshporka .

      # 🔴 Пробне читання до публікації: образ, який збирається, але не читає,
      # гірший за відсутній. Карти на раннері немає, тож CUDA-образ читає на
      # процесорі — це перевіряє рушії й ваги, а не саму карту.
      - name: пробне читання
        run: |
          docker volume create smoke
          docker run --rm -v smoke:/srv/nysh local/nyshporka doctor
          # Другий контейнер на тому самому томі: стан користувача мусив
          # пережити перший, інакше новий простір просить `nysh migrate`.
          docker run --rm -v smoke:/srv/nysh local/nyshporka doctor 2>&1 | tee /tmp/second.log
          if grep -q "nysh migrate" /tmp/second.log; then
            echo "стан користувача не пережив контейнер" && exit 1
          fi
          # Монтування: іменований том — мовчки; без монтування — попередження;
          # стара тека /srv/nyshporka — відмова з кодом 2, а не тихий тимчасовий том.
          if grep -q "не змонтовано" /tmp/second.log; then
            echo "іменований том прийнято за тимчасовий" && exit 1
          fi
          docker run --rm local/nyshporka version 2>&1 | tee /tmp/anon.log
          grep -q "не змонтовано" /tmp/anon.log || { echo "без монтування — без попередження"; exit 1; }
          mkdir -p /tmp/oldpath
          rc=0; docker run --rm -v /tmp/oldpath:/srv/nyshporka local/nyshporka version || rc=$?
          [ "$rc" = 2 ] || { echo "/srv/nyshporka не зупинило запуск (код $rc)"; exit 1; }
          docker run --rm -v smoke:/srv/nysh --entrypoint sh local/nyshporka -c '
            set -e
            nysh-entrypoint sample
            nysh read /srv/nysh/work/data/raw/sample-315-159 --limit 1 --rerun --out /tmp/smoke
            test -s /tmp/smoke/0001.txt
            head -5 /tmp/smoke/0001.txt'

      # Застосунок мусить відкриватись з браузера хоста командою з документації:
      # 0.24.2 вийшла з посиланням на адресу контейнера й 403 на 127.0.0.1.
      # Стеля кроку: демон, що завис, інакше тримав би раннер до 90 хв джоба.
      - name: застосунок у браузері
        timeout-minutes: 5
        run: bash docker/smoke_serve.sh local/nyshporka smoke

      - name: публікація
        run: |
          v=${{ steps.ver.outputs.v }}
          if [ "${{ matrix.variant }}" = cpu ]; then
            # Процесорний образ зводиться в один мультиархітектурний тег нижче;
            # рухомий `cpu-<arch>` — лише джерело кешу для наступної збірки.
            tags="$v-cpu-${{ matrix.arch }} cpu-${{ matrix.arch }}"
          else
            tags="$v-${{ matrix.variant }} ${{ matrix.variant }}"
          fi
          for t in $tags; do
            docker tag local/nyshporka "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done

  cpu-manifest:
    name: процесорний образ · amd64 + arm64
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: зведення тегу
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$v" -t "$IMAGE:latest" \
            "$IMAGE:$v-cpu-amd64" "$IMAGE:$v-cpu-arm64"
          docker buildx imagetools inspect "$IMAGE:$v"
