name: CLA

# Бот просить автора кожного PR підписати CLA.md одним коментарем і не дає
# зеленої позначки, доки підпису немає. Підписи лягають у
# signatures/version1/cla.json на окремій гілці cla-signatures: main захищено,
# і бот туди не пише.
#
# issue_comment спрацьовує лише з воркфлоу на гілці за замовчуванням, тож бот
# оживає після злиття цього файла в main. pull_request_target не робить
# checkout коду PR — action читає лише коментарі й автора комітів, тому права
# на запис тут не дістаються чужому коду.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1, пін за SHA: сторонній action із правом запису
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/SERGIUSH-UA/nyshporka/blob/main/CLA.md
          branch: cla-signatures
          allowlist: SERGIUSH-UA,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            Дякуємо за внесок! Перед злиттям потрібно один раз підписати [ліцензійну угоду з автором внеску (CLA)](https://github.com/SERGIUSH-UA/nyshporka/blob/main/CLA.md): ви зберігаєте авторство, а проєкт дістає право поширювати внесок на будь-яких умовах. Щоб підписати, залиште в цьому PR коментар із рядком нижче.

            Thank you for your contribution! Before merging, please sign our [Contributor License Agreement](https://github.com/SERGIUSH-UA/nyshporka/blob/main/CLA.md) once by posting the comment below in this PR.
          custom-allsigned-prcomment: CLA підписано всіма авторами. / All contributors have signed the CLA.
