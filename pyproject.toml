[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyshporka"
version = "0.1.0.dev0"
description = "Читання рукописних архівних справ і пошук прізвища в них — для генеалогів"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Serhii Dalishchynskyi" }]
keywords = ["genealogy", "htr", "handwriting", "archives", "ocr", "kraken", "parseq"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Natural Language :: Ukrainian",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Sociology :: Genealogy",
]

# 🔴 Нижня межа 3.11, а не 3.13. У коді, що переїжджає, єдиний 3.12-API —
# `os.listdrives()` — уже має фолбек; PEP 695 і `itertools.batched` не
# використовуються. Вузький пін «>=3.13,<3.14» дістався у спадок від
# дослідницького репо й для застосунку, який ставлять чужі люди, шкідливий.
requires-python = ">=3.11"

# Ядро: те, без чого не працює НІЧОГО. 13 залежностей замість 32 — усе важке
# (torch, ultralytics, transformers, mkdocs) винесено в extras, бо генеалог,
# який хоче лише подивитись каталог справ, не має тягнути 3 ГБ.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "typer>=0.12",
  "rich>=13.7",
  "loguru>=0.7",
  "platformdirs>=4.3",
  "pyyaml>=6",
  "python-frontmatter>=1.1",
  "rapidfuzz>=3.10",
  "unidecode>=1.3",
  "pillow>=10.4",
  "jinja2>=3.1",
  "httpx>=0.27",
  # Замок простору мусить відрізняти живого писаря від номера, який ОС уже
  # віддала іншому процесу. Без psutil лишається лише биття серця: покинутий
  # замок протухне, але «живий» чужий PID виглядатиме нашим. 500 КБ за
  # гарантію «один писар» — вигідний обмін.
  "psutil>=6.0",
  # PDF — рівноправний вхід поряд із текою JPEG: архіви масово віддають справу
  # одним файлом. Читач у ЯДРІ, а не в extras, бо інакше найчастіший сценарій
  # («ось PDF з сайту архіву») мовчки не знав би навіть числа сторінок.
  # pypdfium2, а не PyMuPDF: ~3 МБ проти ~20 і дозвільна ліцензія (BSD/Apache).
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
# Браузерна консоль (демон + фронт).
app = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
# Завантажувачі з архівів: дзеркала плівок, ARCHIUM, Synology, каталоги.
archives = [
  "httpx[socks]>=0.27",
  "aiolimiter>=1.1",
  "tenacity>=9",
  "aiosqlite>=0.20",
  "selectolax>=0.3.21",
  "lxml>=5.3",
  "pdfplumber>=0.11",
  "keyring>=25",
]
gedcom = ["ged4py>=0.5"]
# 🔴 torch БЕЗ індексу й БЕЗ піна на cu126. Пін під GTX 1650 (sm_75) з
# дослідницького репо тут шкідливий двічі: на новіших картах cu126 не працює
# взагалі, а на машині без NVIDIA тягне 2.5 ГБ марно. GPU — крок інсталятора
# (`nysh doctor --gpu` читає compute capability і доставляє потрібні колеса),
# а не властивість збірки.
htr = ["torch>=2.2", "torchvision>=0.20", "timm>=1.0"]
ocr = ["paddleocr>=3.5"]
# Агентна поверхня. В extras, а не в ядрі: працювати з агентом НЕ обов'язково —
# без нього застосунок повний, і змушувати кожного ставити транспорт MCP заради
# можливості, якою скористається меншість, немає підстав.
agent = ["mcp>=1.2", "anyio>=4.0"]
all = ["nyshporka[app,archives,gedcom,htr,agent]"]

[project.urls]
Homepage = "https://github.com/SERGIUSH-UA/nyshporka"
Issues = "https://github.com/SERGIUSH-UA/nyshporka/issues"

[project.scripts]
nysh = "nyshporka.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest-asyncio>=1.4.0",
  "types-psutil>=7.2.2.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nyshporka"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 🔴 Патчі kraken перевіряти нашими правилами не можна: це підміни ПРИВАТНИХ
# функцій чужої бібліотеки, доведені рівними оригіналу побітово. Вони мусять
# лишатись дзеркалом того коду, а «причесати» їх означає порушити ту рівність
# без жодного способу це помітити — вихід зміниться тихо.
extend-exclude = ["src/nyshporka/htr/patches"]

[tool.ruff.lint.per-file-ignores]
# ⚠ Файл під активним авторством у паралельній сесії. Стилістичне зауваження
# (вкладені `if`) свідомо не виправляється зараз: правити чужу незакінчену
# роботу заради лінту — вірний спосіб дістати конфлікт на рівному місці.
# Прибрати цей виняток, коли файл усталиться.
"src/nyshporka/fonds/registry.py" = ["SIM102"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501 — довжина рядка вже під контролем форматера.
# RUF001-003 — «неоднозначні» кириличні літери. Проєкт україномовний: коментарі,
# докстрінги й повідомлення користувачу пишуться кирилицею за задумом, тож це
# правило дало б тисячі спрацювань на нормальному тексті.
ignore = [
  "E501",
  "RUF001", "RUF002", "RUF003",
  # B008 — «виклик функції в значенні за замовчуванням». Для typer це не
  # помилка, а ЄДИНИЙ спосіб оголосити параметр: `x: str = typer.Option(...)`.
  # Правило тут дає лише хибні спрацювання на кожній команді CLI.
  "B008",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/nyshporka"]
# 🔴 Патчі kraken не типізуються тут за побудовою: їхні залежності (kraken,
# skimage, torch) живуть в ІНШОМУ інтерпретаторі — тому середовищі рушіїв, — і
# ставити їх у dev-оточення лише заради перевірки типів означало б тягнути
# 3 ГБ. Перевіряються вони інакше: верифікаторами проти оригіналу на живій
# сегментації, і тестом, що вони не імпортують пакет.
exclude = ["src/nyshporka/htr/patches/"]

# 🔴 `strict` діє на ВЕСЬ новий код. Модулі нижче переїхали з дослідницького
# репо разом із типовим боргом, і послаблення для них ЯВНЕ й пойменоване — з
# числом помилок на момент переїзду.
#
# Чому не загальне послаблення: тоді борг стає невидимим і росте далі. Чому не
# «полагодити одразу»: переїзд і виправлення в одному кроці не можна звірити —
# золотий зріз не відрізнить «перенесли» від «змінили поведінку».
#
# Правило: модуль виходить із цього списку, коли його чистять; повертатись сюди
# не можна. Новий модуль сюди не додається ніколи.
[[tool.mypy.overrides]]
module = [
  "nyshporka.storage.reindex",    # 34
  "nyshporka.storage.tree_graph", # 14
  "nyshporka.core.profile",       # 12
  "nyshporka.storage.files",      # 5
  "nyshporka.matching.review",    # 2
  "nyshporka.core.workspace",     # 1
  "nyshporka.models.candidate",   # 1
  "nyshporka.models.region",      # 1
  # архівний шар, переїхав разом зі своїм боргом
  "nyshporka.library",            # 46
  "nyshporka.cases.db",           # 32
  "nyshporka.fonds.registry",     # 23
  "nyshporka.htr_store",          # 19
  "nyshporka.cases.collect",      # 17
  "nyshporka.cases.resolve",      # 10
  "nyshporka.decode_hits",        # 9
  "nyshporka.pagestore.cli",      # 9
  "nyshporka.cases.cli",          # 7
  "nyshporka.pagestore.models",   # 7
  "nyshporka.pagestore.query",    # 6
  "nyshporka.pagestore.store",    # 5
  "nyshporka.cases.geo",          # 3
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["attr-defined", "arg-type", "assignment", "unused-ignore",
                      "union-attr", "misc", "type-var", "operator", "index",
                      "return-value", "call-overload", "var-annotated"]
# ⚠ `misc` ховає, зокрема, «читання змінної `e` після except-блока»
# (`pagestore/cli.py`) — Python видаляє її на виході з блока, тож це справжня
# латентна вада, а не стиль. Лишена свідомо: виправляти її треба окремо, зі
# своїм замірoм, а не в коміті переїзду, де зріз не відрізнить «перенесли» від
# «змінили поведінку».

# Пакети без анотацій, на які ми не впливаємо.
[[tool.mypy.overrides]]
module = ["frontmatter.*", "unidecode.*", "yaml.*", "pypdfium2.*", "fitz.*",
          "mcp.*", "anyio.*"]
ignore_missing_imports = true

# Транспорт MCP живе в extras і в dev-оточенні не стоїть; його декоратори
# нетипізовані. Функції всередині `serve()` — тонкі обгортки над уже
# перевіреними `tool_definitions()` і `call_tool()`, які типізуються повністю.
[[tool.mypy.overrides]]
module = ["nyshporka.mcp.server"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Черга завдань асинхронна за побудовою (усі мутації під одним `asyncio.Lock`),
# тож її тести — корутини. `auto` позбавляє потреби мітити кожну.
asyncio_mode = "auto"
