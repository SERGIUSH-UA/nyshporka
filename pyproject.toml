[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyshporka"
# 🔴 Версія живе В ОДНОМУ місці — `src/nyshporka/__init__.py`. Доти, доки вона
# стояла і тут, і там, ніщо не тримало їх рівними: `nysh version` друкує
# `__version__`, а `pip show` — метадані колеса, тож розбіжність з'явилась би
# тихо й показувалась би різним людям по-різному.
dynamic = ["version"]
description = "Читання рукописних архівних справ і пошук прізвища в них — для генеалогів"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Serhii Dalishchynskyi" }]
keywords = ["genealogy", "htr", "handwriting", "archives", "ocr", "kraken", "parseq"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Natural Language :: Ukrainian",
  # Windows першою не за алфавітом: аудиторія — генеалоги зі сканами на
  # зовнішніх дисках, і саме там живуть junction'и, під які писані гарди шляхів.
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Sociology :: Genealogy",
]

# 🔴 Нижня межа 3.11, а не 3.13. У коді, що переїжджає, єдиний 3.12-API —
# `os.listdrives()` — уже має фолбек; PEP 695 і `itertools.batched` не
# використовуються. Вузький пін «>=3.13,<3.14» дістався у спадок від
# дослідницького репо й для застосунку, який ставлять чужі люди, шкідливий.
requires-python = ">=3.11"

# Ядро: те, без чого не працює НІЧОГО. 13 залежностей замість 32 — усе важке
# (torch, ultralytics, transformers, mkdocs) винесено в extras, бо генеалог,
# який хоче лише подивитись каталог справ, не має тягнути 3 ГБ.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "typer>=0.12",
  "rich>=13.7",
  "loguru>=0.7",
  "platformdirs>=4.3",
  "pyyaml>=6",
  "python-frontmatter>=1.1",
  "rapidfuzz>=3.10",
  "unidecode>=1.3",
  "pillow>=10.4",
  "jinja2>=3.1",
  "httpx>=0.27",
  # Замок простору мусить відрізняти живого писаря від номера, який ОС уже
  # віддала іншому процесу. Без psutil лишається лише биття серця: покинутий
  # замок протухне, але «живий» чужий PID виглядатиме нашим. 500 КБ за
  # гарантію «один писар» — вигідний обмін.
  "psutil>=6.0",
  # PDF — рівноправний вхід поряд із текою JPEG: архіви масово віддають справу
  # одним файлом. Читач у ЯДРІ, а не в extras, бо інакше найчастіший сценарій
  # («ось PDF з сайту архіву») мовчки не знав би навіть числа сторінок.
  # pypdfium2, а не PyMuPDF: ~3 МБ проти ~20 і дозвільна ліцензія (BSD/Apache).
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
# Браузерна консоль (демон + фронт).
app = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
# Завантажувачі з архівів: дзеркала плівок, ARCHIUM, Synology, каталоги.
archives = [
  "httpx[socks]>=0.27",
  "aiolimiter>=1.1",
  "tenacity>=9",
  "aiosqlite>=0.20",
  "selectolax>=0.3.21",
  "lxml>=5.3",
  "pdfplumber>=0.11",
  "keyring>=25",
]
gedcom = ["ged4py>=0.5"]
# 🔴 torch БЕЗ індексу й БЕЗ піна на cu126. Пін під GTX 1650 (sm_75) з
# дослідницького репо тут шкідливий двічі: на новіших картах cu126 не працює
# взагалі, а на машині без NVIDIA тягне 2.5 ГБ марно. GPU — крок інсталятора
# (`nysh doctor --gpu` читає compute capability і доставляє потрібні колеса),
# а не властивість збірки.
htr = ["torch>=2.2", "torchvision>=0.20", "timm>=1.0"]
ocr = ["paddleocr>=3.5"]
# Агентна поверхня. В extras, а не в ядрі: працювати з агентом НЕ обов'язково —
# без нього застосунок повний, і змушувати кожного ставити транспорт MCP заради
# можливості, якою скористається меншість, немає підстав.
# 🔴 Пін `<2`: `mcp` 2.0 — інший SDK (inputSchema→input_schema, mimeType→mime_type,
# зникли декоратори `@server.list_tools()`). Код у `nyshporka/mcp/` написаний під 1.x,
# тож без стелі свіжа інсталяція тягне 2.x і `nysh mcp serve` не стартує.
agent = ["mcp>=1.2,<2", "anyio>=4.0"]
# Сайт документації. 🔴 В `all` НЕ входить: генеалогові, який ставить
# застосунок, збирач сайту не потрібен — його ставить лише CI і той, хто
# правит документацію.
docs = ["mkdocs-material>=9.5"]
all = ["nyshporka[app,archives,gedcom,htr,agent]"]

[project.urls]
Homepage = "https://github.com/SERGIUSH-UA/nyshporka"
Source = "https://github.com/SERGIUSH-UA/nyshporka"
Issues = "https://github.com/SERGIUSH-UA/nyshporka/issues"
Changelog = "https://github.com/SERGIUSH-UA/nyshporka/blob/main/CHANGELOG.md"

[project.scripts]
nysh = "nyshporka.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest-asyncio>=1.4.0",
  "types-psutil>=7.2.2.20260518",
  # 🔴 Лише щоб раннер узагалі імпортувався в тестах. Він їде в середовищі
  # рушіїв, але його чиста логіка — рятувальний відбір — вирішує, які рядки
  # перечитає другий рушій, а які не перечитає НІХТО. Без numpy ця логіка не
  # покривається в CI взагалі, бо модуль не завантажується. Torch і kraken сюди
  # НЕ додаються: вони потрібні лише всередині функцій.
  "numpy>=1.26",
  # 🔴 Розбирач HTML із extras `archives` — тут він потрібен, щоб розбір
  # каталогів архівів узагалі перевірявся. Саме цей код читає чужу розмітку,
  # тобто ламається не від наших змін, а від чужих; лишити його без тестів
  # означало б дізнаватись про поломку від користувача.
  "selectolax>=0.3.21",
  # 🔴 Демон у dev теж — інакше поверхня HTTP не має жодного тесту. Саме вона
  # тримає правило «один писар на простір» і токен на мутаціях; помилку тут
  # видно не в лозі, а тим, що двоє одночасно псують нотатки.
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
]

[tool.hatch.version]
path = "src/nyshporka/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nyshporka"]
# Дані пакета (маніфест рушіїв, перелік паків, каталоги архівів, зразкова
# справа, фронт) — частина коду, а не ресурси збірки: без них застосунок не знає
# ні що качати, ні чим читати.
# 🔴 `data/**`, а не `data/*`: патерн має gitignore-семантику, де `*` НЕ
# переходить через `/`. Зі старим правилом кадри зразка
# (`setup/data/sample/frames/*.jpg`) не потрапили б у колесо — локально й у
# тестах усе працює, бо файли лежать на диску, а ламається рівно в користувача.
# ⚠ `static/**`, а не `static/*` — з тієї самої причини, що рядком вище про
# `data/**`: патерн має gitignore-семантику, де одна зірочка НЕ переходить
# через `/`. Зі старим правилом перша ж підтека фронту не потрапила б у
# колесо — локально й у тестах усе працює, ламається рівно в користувача.
artifacts = ["src/nyshporka/**/data/**", "src/nyshporka/daemon/static/**"]
# 🔴 Скіли агента живуть у `.claude/skills/` — там, де їх читає Claude Code,
# коли працюють НАД САМИМ пакетом. Тобто джерело правди й те, що бачить
# розробник, — один каталог: розійтись їм ніде. У колесо він їде під іменем
# пакета, звідки `nysh skills install` кладе його користувачеві.
force-include = { ".claude/skills" = "nyshporka/skills" }

[tool.ruff]
line-length = 100
target-version = "py311"
# 🔴 Патчі kraken перевіряти нашими правилами не можна: це підміни ПРИВАТНИХ
# функцій чужої бібліотеки, доведені рівними оригіналу побітово. Вони мусять
# лишатись дзеркалом того коду, а «причесати» їх означає порушити ту рівність
# без жодного способу це помітити — вихід зміниться тихо.
extend-exclude = ["src/nyshporka/htr/patches"]

[tool.ruff.lint.per-file-ignores]
# ⚠ E741 змінна `l` — у гарді, який уже одного разу приховав знахідку
# (`clan-scan-l-guard-blind-to-own-truth`). Перейменувати варто, але окремим
# кроком: цей гард вирішує, який рядок побачить око, і плутати перейменування
# з правкою його логіки не можна.
"src/nyshporka/htr/runner.py" = ["E741"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501 — довжина рядка вже під контролем форматера.
# RUF001-003 — «неоднозначні» кириличні літери. Проєкт україномовний: коментарі,
# докстрінги й повідомлення користувачу пишуться кирилицею за задумом, тож це
# правило дало б тисячі спрацювань на нормальному тексті.
ignore = [
  "E501",
  "RUF001", "RUF002", "RUF003",
  # B008 — «виклик функції в значенні за замовчуванням». Для typer це не
  # помилка, а ЄДИНИЙ спосіб оголосити параметр: `x: str = typer.Option(...)`.
  # Правило тут дає лише хибні спрацювання на кожній команді CLI.
  "B008",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/nyshporka"]
# 🔴 Патчі kraken не типізуються тут за побудовою: їхні залежності (kraken,
# skimage, torch) живуть в ІНШОМУ інтерпретаторі — тому середовищі рушіїв, — і
# ставити їх у dev-оточення лише заради перевірки типів означало б тягнути
# 3 ГБ. Перевіряються вони інакше: верифікаторами проти оригіналу на живій
# сегментації, і тестом, що вони не імпортують пакет.
exclude = ["src/nyshporka/htr/patches/"]

# 🔴 `strict` діє на ВЕСЬ код. Список послаблень нижче був на 23 модулі й 353
# помилки — це борг, що приїхав із дослідницького репо разом із самим кодом.
# Лишилось ТРИ модулі, і в кожного причина не «руки не дійшли».
#
# Правило те саме: модуль виходить зі списку, коли його чистять; повертатись
# сюди не можна, новий модуль сюди не додається ніколи.
#
# ⚠ Дорогою чистка знайшла те, чого не бачив жоден тест: сортування списку, у
# якому могли бути None; читання `Match.group()` без перевірки на збіг; одне
# ім'я на дві різні сутності в одній функції (id родини й rowid факту; список
# ідентифікаторів і список осіб). Жодне з них не падало на наявних даних — усі
# чекали на дані, яких у нас ще не було.
#
# ⚠ А ще виявилось, що позначки `misc` боятись не варто було: «читання змінної
# `e` після except-блока» у `pagestore/cli.py` виявилось перевикористанням
# імені в циклі. Python справді видаляє змінну винятку на виході з блока, але
# цикл присвоює її наново — тобто це не латентна вада, а місце, якого перевіряч
# не міг довести. Перевірено виконанням; ім'я розведено, код лишився тим самим.

# ── три модулі, що лишились у боргу ──────────────────────────────────────────
# `library` (47) і `fonds.registry` (23) — під активним авторством у паралельній
# сесії. Правити чужу незакінчену роботу заради типів означає конфлікт злиття на
# рівному місці й невдячний розбір, чия зміна що зламала. Прибрати цей виняток,
# коли файли усталяться (там же стоїть і ruff-виняток SIM102).
#
# `htr.runner` (95) — половина з них це `import-not-found` на torch, kraken і
# патчі, що вантажаться ЗА ШЛЯХОМ ФАЙЛА; вони живуть в іншому інтерпретаторі й
# сюди не приїдуть. Друга половина — анотації функцій, які приймають об'єкти
# саме тих бібліотек: написати їх, не маючи бібліотек під рукою, означає
# вигадати типи й отримати перевірку, що доводить вигадане. Раннер натомість
# охороняється тим, чим його справді можна охороняти: AST-тестом «жоден гість
# середовища рушіїв не імпортує пакет» і тестами чистої логіки відбору.
[[tool.mypy.overrides]]
module = [
  "nyshporka.htr.runner",         # 95
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["attr-defined", "arg-type", "assignment", "unused-ignore",
                      "union-attr", "misc", "type-var", "operator", "index",
                      "return-value", "call-overload", "var-annotated"]

# Пакети без анотацій, на які ми не впливаємо.
[[tool.mypy.overrides]]
module = ["frontmatter.*", "unidecode.*", "yaml.*", "pypdfium2.*", "fitz.*",
          "mcp.*", "anyio.*"]
ignore_missing_imports = true

# 🔴 Світ СЕРЕДОВИЩА РУШІЇВ. Ці модулі не «забули поставити» — їх тут не буде
# ніколи: вони живуть в окремому venv із піном `kraken==7.0.2` під патчі, і
# тягнути 3 ГБ у dev-оточення заради перевірки типів немає підстав. Патчі
# (`gpu_sato`, `fast_geom`, `seg_ceiling`) і сусід `pysar_lines_infer` до того ж
# вантажаться ЗА ШЛЯХОМ ФАЙЛА, а не імпортом пакета — інакше раннер знав би про
# пакет, якого в його інтерпретаторі немає.
[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "kraken.*", "strhub.*", "timm.*",
          "skimage.*", "scipy.*", "shapely.*",
          "gpu_sato", "fast_geom", "seg_ceiling", "pysar_lines_infer"]
ignore_missing_imports = true

# Транспорт MCP живе в extras і в dev-оточенні не стоїть; його декоратори
# нетипізовані. Функції всередині `serve()` — тонкі обгортки над уже
# перевіреними `tool_definitions()` і `call_tool()`, які типізуються повністю.
[[tool.mypy.overrides]]
module = ["nyshporka.mcp.server"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Черга завдань асинхронна за побудовою (усі мутації під одним `asyncio.Lock`),
# тож її тести — корутини. `auto` позбавляє потреби мітити кожну.
asyncio_mode = "auto"
