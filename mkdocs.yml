            Дотренувати модель: Modell nachtrainieren
            Прочитати на орендованій машині: Auf einer gemieteten Maschine lesen
            Нишпорка в Docker: Nyshporka in Docker
            Обмінятись прочитаним (Супряга): Gelesenes teilen (Supriaha)
            Що нового: Neuigkeiten
