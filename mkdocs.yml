            Як працювати: Jak pracować
            Часті питання: Częste pytania
            Для досвідчених: Dla zaawansowanych
            Дотренувати модель: Douczanie modelu
            Прочитати на орендованій машині: Odczyt na wynajętej maszynie
            Нишпорка в Docker: Nyshporka w Dockerze
            Обмінятись прочитаним (Супряга): Wymiana odczytanych akt (Supriaha)
            Що нового: Co nowego
            Ліцензії й приватність: Licencje i prywatność
            Для помічника й розробника: Dla asystenta i programisty
        - locale: ro
          name: Română
          build: true
          site_name: Nyshporka
          site_description: Citește manuscrisul. Aduce ce a găsit.
          nav_translations:
            Що таке Нишпорка: Ce este Nyshporka
            Поставити й підключити помічника: Instalarea și conectarea asistentului
            Як працювати: Cum se lucrează
            Часті питання: Întrebări frecvente
            Для досвідчених: Pentru avansați
            Дотренувати модель: Antrenarea suplimentară a modelului
            Прочитати на орендованій машині: Citirea pe o mașină închiriată
            Нишпорка в Docker: Nyshporka în Docker
            Обмінятись прочитаним (Супряга): Schimbul de dosare citite (Supriaha)
            Що нового: Ce este nou
            Ліцензії й приватність: Licențe și confidențialitate
            Для помічника й розробника: Pentru asistent și dezvoltator
        - locale: fr
          name: Français
          build: true
