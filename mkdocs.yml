          nav_translations:
            Що таке Нишпорка: Qu’est-ce que Nyshporka
            Поставити й підключити помічника: Installer et connecter l’assistant
            Як працювати: Comment travailler
            Часті питання: Questions fréquentes
            Для досвідчених: Pour les utilisateurs avancés
            Дотренувати модель: Affiner le modèle
            Прочитати на орендованій машині: Lire sur une machine louée
            Нишпорка в Docker: Nyshporka dans Docker
            Обмінятись прочитаним (Супряга): Partager ce qui a été lu (Supriaha)
            Що нового: Nouveautés
            Ліцензії й приватність: Licences et confidentialité
            Для помічника й розробника: Pour l’assistant et les développeurs
        - locale: de
