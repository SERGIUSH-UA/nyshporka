# 🐾 Сайт документації Нишпорки.
#
# 🔴 Кольори сайту НЕ описані тут. Вони приходять із `docs/stylesheets/brand.css`,
# згенерованого з `src/nyshporka/brand/data/brand.yaml` — того самого джерела,
# з якого беруть тему застосунок і командний рядок. Вписана сюди палітра
# розійшлася б із ними тихо: сайт виглядав би як окремий продукт.
#
#     uv run python -m nyshporka.brand.gen          # переписати згенероване
#     uv run python -m nyshporka.brand.gen --check  # приймач, він же в CI

site_name: Нишпорка
site_description: Читає рукопис. Приносить знайдене.
# Адреса — з оточення: сайт живе на nyshporka.online/docs/ (портал збирає
# його сам із піна на коміт клієнта), а на github.io лягають заглушки з
# canonical на нову адресу — їх робить `tools/docs_redirect_stubs.py`.
site_url: !ENV [DOCS_SITE_URL, "https://nyshporka.online/docs/"]
repo_url: https://github.com/SERGIUSH-UA/nyshporka
repo_name: SERGIUSH-UA/nyshporka
copyright: AGPL-3.0-or-later

theme:
  name: material
  language: uk
  logo: assets/logo.webp
  # Іконка вкладки — порталу, а не лапка застосунку: документація живе
  # всередині nyshporka.online, і вкладка мусить казати те саме, що й решта.
  favicon: assets/favicon-32.png
  # 🔴 Шапка й підвал — порталу: документація живе всередині
  # nyshporka.online і не мусить виглядати окремим сайтом.
  custom_dir: overrides
  # Шрифти — свої, з того самого домену (docs/assets/fonts), а не Google
  # Fonts: запит до чужого CDN на кожне відкриття сторінки — це адреса
  # відвідувача на чужому сервері.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    # Дві теми з перемикачем, база — світла, як на порталі. Без `media`:
    # тема та сама, що обрана на порталі (див. overrides/main.html), а не та,
    # що в системі — інакше з порталу в документацію людина переходила б у
    # іншу тему. `custom`, щоб палітри Material не перебивали наші змінні.
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Темна тема}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Світла тема}

# ⚠ `docs/README.md` із сайту виключено явно. MkDocs вважає його синонімом
# index.md і однаково не публікує, але без цього рядка попереджає про це на
# кожній збірці — а CI зібрано в `--strict`, де попередження валить прогін.
# Файл лишається мапою документації для того, хто читає репозиторій із GitHub.
# 🔴 `share.md` виключено, доки не запущено Супрягу: сторінка описує робочий
# обмін, а команда поки відмовляє без прапорця. Документація, що обіцяє більше,
# ніж робить збірка, дорожча за її відсутність. Повернути разом із пулом.
exclude_docs: |
  README.md
  share.md

extra_css:
  - stylesheets/brand.css
  - stylesheets/portal-docs.css

extra_javascript:
  - javascripts/tema.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed: {alternate_style: true}
  # Іконки Material у тексті (`:material-download:`). Без цього розширення
  # код іконки друкувався на кнопці буквально — і `--strict` цього не ловить.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# ⚠ `docs/README.md` у nav немає навмисно: MkDocs вважає його синонімом
# index.md і виключає з сайту. Він лишається мапою документації для того,
# хто читає репозиторій із GitHub, а не із сайту.
# 🔴 Меню — для людини (скорочено 2026-09-23 з 24 пунктів до 8). Сторінки
# `agents/*` — робочі інструкції помічника: у меню лише їхній вхід, самі вони
# збираються за старими адресами (на них посилаються AGENTS.md, довідка CLI і
# копії в скілах). Злиті сторінки (agent, features, limits, screens) лишаються
# заглушками з `template: redirect.html` — їхні адреси роздані назовні.
nav:
  - Що таке Нишпорка: index.md
  - Поставити й підключити помічника: install.md
  - Як працювати: start.md
  - Часті питання: faq.md
  - Для досвідчених:
      - Дотренувати модель: train.md
      - Прочитати на орендованій машині: cloud.md
  - Що нового: whats-new.md
  - Ліцензії й приватність: signing.md
  - Для помічника й розробника: agents/index.md

# Сторінки поза меню — без попередження на кожній збірці (`--strict`).
not_in_nav: |
  agent.md
  features.md
  limits.md
  screens.md
  agents/*.md
