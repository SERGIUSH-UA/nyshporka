# Профілі суцільної вичитки справи в структуровані записи (`nysh records`).
#
# Навіщо файл, а не числа в коді: усе, що тут стоїть, підібрано під ОДИН тип
# книги — православну метрику Російської імперії другої половини XIX ст.
# Костел, сповідні розписи чи ревізька казка мають інакшу геометрію аркуша,
# інші лічильники й іншу мову, і перенесення «як є» дає ТИХО зіпсований
# реєстр. Нову книгу заводять новим профілем, коду не чіпаючи.
#
# Профіль успадковується через `extends`; вказані поля перекривають успадковані.
#
# 🔴 Цей файл — у пакеті, і правити його не треба. Свої профілі й прив'язки
# справ кладіть у `<простір>/config/records_profiles.yaml`: він накладається
# зверху, тож оновлення пакета ваших налаштувань не змиває.

defaults:

  # ── Нарізка розвороту на тайли ────────────────────────────────────────────
  # Скан метричної книги — це ПОВНИЙ розворот (~4000×3000), і акт тягнеться
  # горизонтально через обидві сторінки. Модель стискає зображення до ~1568px,
  # тобто цілий розворот бачить у 0.39× — скоропис розсипається. Смуги повертають
  # рядкам майже натуральну величину.
  tiles:
    rows: 6              # смуг на сторінку; більше — для щільніших книг
    overlap: 0.35        # наскільки смуги налазять: жоден акт не має бути розрізаний
    split: 0.50          # де межа лівої й правої сторінок (частка ширини)
    split_overlap: 0.06  # ± запас, щоб згин не з'їв крайній стовпчик
    margin: 0.015        # обрізати технічні краї скана
    head_frac: 0.16      # верхівка з друкованим заголовком і роком
    preview_max: 1600    # оглядовий тайл усього розвороту
    quality: 92          # JPEG; нижче — починають плисти тонкі штрихи
    # zoom: половинки смуг, реально збільшені (LANCZOS) і з розтягнутим по
    # перцентилях контрастом. ⚠ Сам по собі зум не рятує вицвілі аркуші:
    # там обмежує не роздільність, а контраст — на шлюбах 1875 чорнило й папір
    # розділяє ~37 рівнів яскравості з 255.
    zoom: false
    zoom_target_px: 1540 # модель усе одно стискає до ~1568 — більше віддавати марно

  # ── Структура книги ───────────────────────────────────────────────────────
  # Головне, що змінюється між типами джерел, і головне джерело доказу повноти.
  book:
    # Народження й смерті нумеруються ДВОМА незалежними лічильниками
    # (мужеска / женска), шлюби — одним наскрізним.
    lanes_by_sex: [birth, death]
    lanes_single: [marriage]
    # Причт наприкінці місяця й року рахує сам себе: «родилось мужеска 5,
    # женска 4». Це єдиний незалежний чексум вичитки.
    has_tally: true
    # Акт лежить у книзі за датою ОБРЯДУ (хрещення/поховання), а не події:
    # дитина, народжена 24 листопада і хрещена 5 грудня, потрапляє в грудневу
    # нумерацію. `event` — для джерел, де номер присвоюється за датою події.
    numbering_by: rite
    # Дореформена кирилиця з ѣ/ѳ/і та титлами. Для костельних книг — latin_pl.
    script: cyrillic_prereform

  # ── Звід осіб і дворів ────────────────────────────────────────────────────
  reconstitute:
    fuzzy_surname: 88      # «Мурлика»/«Мурлыка» — той самий двір
    fuzzy_patronymic: 82   # по батькові коливається сильніше за прізвище
    fuzzy_place: 85        # «Мясковки»/«Мястковка» — один топонім
    # Причт повторюється під кожним актом однаково: у реєстрі мешканців це шум
    # і джерело фальшивих конфліктів. З записів НЕ видаляється, лише не стає
    # особою реєстру. Духовенство серед мирян («діаконовъ сынъ» як наречений)
    # проходить під звичайною роллю й лишається.
    skip_roles: [priest]
    # Особа без прізвища («Марія Іоаннова») НІКОЛИ не склеюється між актами:
    # тезок у селі десятки, і краще дублікат, ніж вигадана людина.
    merge_anonymous: false

  # ── Консенсус двох незалежних вичиток ─────────────────────────────────────
  # Один прохід не є джерелом істини: агент подає помилкове прочитання як
  # упевнене. У реєстр без ескалації йде тільки те, на чому дві вичитки зійшлися.
  consensus:
    prefer: b              # чия версія перемагає у спірному полі
    fuzzy_same_name: 88    # «Татіана»/«Татіанна» — не різночитання, а орфографія
    near_scans: 6          # у межах скількох аркушів акт із тим самим № — той самий
    # `name` похідне від given/patronymic/surname — його конфлікт завжди дублює
    # конфлікт складників; `sheet` — номер аркуша, а не факт про людину.
    no_escalate_fields: [name, sheet]

profiles:

  # ═══ Православна метрика РІ, друга половина XIX ст. ═══════════════════════
  orthodox_metric_19:
    title: "Православна метрична книга РІ (Н/Ш/С), сер.–кін. XIX ст."
    # Усе береться з defaults вище.

  # ═══ Заготовки для інших типів джерел ═════════════════════════════════════
  # Не перевірені на реальному матеріалі — підганяти при першому вжитку.

  catholic_metric:
    extends: orthodox_metric_19
    title: "Костельна метрика (латина/польська)"
    note: >
      Записи суцільним текстом абзацами, а не в графах; нумерація зазвичай одна
      наскрізна; підсумків причту часто немає — тоді повноту доводити нема чим,
      і `has_tally: false` це чесно фіксує.
    book:
      lanes_by_sex: []
      lanes_single: [birth, marriage, death]
      has_tally: false
      numbering_by: rite
      script: latin_pl

  confession_list:
    extends: orthodox_metric_19
    title: "Сповідні розписи (двори, не акти)"
    note: >
      Одиниця — двір із переліком душ і віком, а не подія. Нумерація дворів
      наскрізна; підсумки за станами наприкінці. Смуг треба більше: у сповідці
      на аркуші вдвічі-втричі щільніше рядків, ніж у метриці.
    tiles:
      rows: 9
      overlap: 0.30
    book:
      lanes_by_sex: []
      lanes_single: [confession_entry]
      has_tally: true
      numbering_by: event

  revision_tale:
    extends: orthodox_metric_19
    title: "Ревізька казка"
    note: >
      Одиниця — сім'я з номером за попередньою і теперішньою ревізією; чоловіча
      й жіноча половини часто на РІЗНИХ розворотах, тому лічильники за статтю
      лишаються, але звірка йде окремими секціями.
    tiles:
      rows: 8
    book:
      lanes_by_sex: [revision_entry]
      lanes_single: []
      has_tally: true
      numbering_by: event

# Прив'язка справ до профілів живе в просторі
# (`<простір>/config/records_profiles.yaml`, секція `cases`): це знання про
# конкретну книгу, а не про тип джерела.

fallback: orthodox_metric_19
