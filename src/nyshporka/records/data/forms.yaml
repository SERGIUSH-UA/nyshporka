# Шаблони друкованих бланків: підпис поля → куди його значення в записі.
#
# Читання поклітинно (`nysh read --form-cells`) дає голос `<прогін>-cells`: на
# рядок — клітинка з адресою (сторінка, рядок таблиці, колонка). Шаблон каже,
# яка клітинка що означає. Зіставлення — за ДРУКОВАНИМИ ПІДПИСАМИ, а не за
# координатами: друк рушій читає добре, і той самий шаблон бере обидві редакції
# бланка й бланки з іншим кроком сітки.
#
# Поле: `label` — написання підпису (кілька — будь-яке з них); `section` — у
# якому розділі бланка (за якорями `sections`), порожньо — у будь-якому;
# `to` — куди значення: `<роль>.<поле>`, по одному на клітинку праворуч від
# підпису в тому ж рядку таблиці (батько — перша, мати — друга). Значення може
# стояти й у самій клітинці підпису, після нього (лінію між ними сітка не завжди
# бачить) — але лише коли підпис на початку клітинки; `anywhere: true` — де
# завгодно в ній; `inline: false` — ніколи. `pattern` — регекс значення (номер
# акта — цифри). Якоря розділу на сторінці не видно — однакові підписи різних
# розділів розбираються за порядком полів тут.
#
# Ролі — як у записах (`child`, `father`, `mother`, `informant`, …); `record` —
# поля самого акта (`row` — номер, `date_text` — дата як прочитано). Поля
# особи: `surname`, `given`, `patronymic`, `sex`, `age`, `place`, `note`.
#
# 🔴 Дата й вік з декоду — не факт: вони лягають рядком у `comment` / `age` як
# прочитано, а не в `date` запису. Звіряє око.
#
# 🔴 Цей файл — у пакеті, і правити його не треба. Свої шаблони кладіть у
# `<простір>/config/forms.yaml`: він накладається зверху за іменем шаблону.

forms:

  zags_birth:
    title: "Запис акта про народження (НКВС / ЗАГС УРСР, 1940-ві)"
    rtype: birth
    # Сторінка бланка впізнається хоч одним із цих написів.
    match: ["ЗАПИС АКТА ПРО НАРОДЖЕННЯ", "АКТА ПРО НАРОДЖЕННЯ"]
    sections:
      child: ["ВІДОМОСТІ ПРО ДИТИНУ"]
      parents: ["ВІДОМОСТІ ПРО БАТЬКІВ"]
    fields:
      - {label: ["ПРО НАРОДЖЕННЯ №"], to: [record.row], anywhere: true, pattern: '[0-9]+'}
      # Часті перекручення друку рушієм — окремими написаннями підпису.
      - {label: ["Прізвище"], section: child, to: [child.surname]}
      - {label: ["Ім'я", "Імія"], section: child, to: [child.given]}
      - {label: ["Стать"], section: child, to: [child.sex]}
      - {label: ["Час народження"], section: child, to: [record.date_text]}
      - {label: ["Прізвище"], section: parents, to: [father.surname, mother.surname]}
      - {label: ["Ім'я", "Імія"], section: parents, to: [father.given, mother.given]}
      - {label: ["По батькові"], section: parents, to: [father.patronymic, mother.patronymic]}
      - {label: ["Вік"], section: parents, to: [father.age, mother.age]}
      - {label: ["Національність"], section: parents, to: [father.note, mother.note]}
