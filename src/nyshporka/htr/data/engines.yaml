# 🖋 Рушії читання рукопису — маніфест середовища.
#
# Досі це були константи у скрипті-сетапі, і саме тому там роками жила діра:
# скрипт ставив kraken і torch, але НЕ ставив strhub/timm/nltk — тобто на чистій
# машині Скриба й Дяк працювали, а Писар (головний кириличний рушій) не
# запускався взагалі. У переліку рядків таку дірку видно; у коді вона не видна.
#
# 🔴 Чому окреме середовище, а не основне. kraken конфліктує резолвером з
# основним пакетом, а `torch` тут ставиться під конкретну карту. Тому рушії
# живуть у власному venv, і застосунок говорить із ним лише через підпроцес.

version: 1

runtime:
  id: htr
  # Одне середовище на всі три рушії: раннер обирає рушій за РОЗШИРЕННЯМ моделі,
  # тож вони й так ділять один інтерпретатор.
  python: "3.11"

  packages:
    # 🔴 ПІН НАВМИСНИЙ І ЗНІМАТИ ЙОГО НЕ МОЖНА. Сегментація йде на kraken із
    # патчами приватних функцій (`patches:` нижче), доведеними рівними
    # оригіналу саме на цій версії. Інша версія дала б ТИХУ розбіжність: ті
    # самі скани → інші полігони рядків → інший текст, без помилки в лозі.
    # Піднімати — лише разом із перезапуском усіх верифікаторів патчів і
    # `kraken_lineage_verify` (він вирішує, чи переживе кеш сегментації).
    # 7.1.1 — бо моделі PP-OCRv6 (`.safetensors`: Дяк-Літописець, Скриба-PP)
    # вантажить лише kraken ≥ 7.1; код, який підміняють патчі, у 7.0.2 і 7.1.1
    # побайтово той самий.
    - "kraken==7.1.1"
    # Нижче — те, без чого не вантажиться Писар (PARSeq). Саме їх бракувало.
    - "timm>=1.0"
    - "nltk>=3.9"
    - "pytorch-lightning>=2.0"
    # 🔴 Ці дві — для РЯТУВАЛЬНОГО проходу, і без них він мовчить. Прохід міряє
    # схожість рядка до шуканих форм, а щоб міряти, треба спершу нормалізувати
    # написання (дореформене, сучасне, латинізоване — одне слово). Нормалізатор
    # у раннера ОДИН, той самий, що в пошуку, і вантажиться за шляхом файлу;
    # але його власні залежності мають бути тут, інакше він упаде — а впаде
    # мовчки, бо імпорт лінивий, і виглядатиме це як «нема чого рятувати».
    # (Сам нормалізатор обходиться stdlib — звірено; ставиться лише вимірювач
    # схожості. Якщо в нього колись з'явиться `unidecode`, додати сюди й його.)
    - "rapidfuzz>=3.10"

  vcs_packages:
    - name: strhub
      # ⚠ Форма PEP 508 (`ім'я @ URL`) навмисна: без неї в рядку немає імені
      # пакета взагалі — лише ім'я РЕПОЗИТОРІЮ (`parseq`), яке з ним не
      # збігається. Саме на цій розбіжності пакет тихо не ставився.
      # 🔴 Закріплено за комітом, а не за HEAD: інакше кожен `nysh htr install`
      # і кожен бокс у хмарі виконували б `setup.py` з поточного стану чужого
      # репозиторію — і збірка рушіїв не була б відтворюваною.
      spec: "strhub @ git+https://github.com/baudm/parseq.git@1902db043c029a7e03a3818c616c06600af574be"
      note: |
        Scene Text Recognition Model Hub, Apache-2.0. Використовується ЛИШЕ
        PARSeq. ⚠ Пакет містить підмодуль `models/abinet` під non-commercial
        ліцензією USTC — його не вантажимо й не поширюємо.

  torch:
    # Дефолт — CPU. Задача впирається в ЯДРА, не у відеокарту (заміряно: 92%
    # часу CPU при завантаженні карти близько нуля), тож на CPU все працює,
    # просто повільніше. Заміри 01.10.2026 (0.21, два голоси, щільна сторінка
    # ~77 рядків): i7-9750H 6 ядер — 61 с/стор, GTX 1650 — 14 с, текст
    # тотожний. Люди в чаті: i7-6700 — 19 с, M4 у 3 шарди — 14–16 с.
    default: ["torch", "torchvision"]
    # Еталонна збірка — те, що резолвить kraken 7.1.1 на свіжій машині
    # (`torch<=2.14` → 2.14.0). Середовище, оновлене на місці, лишає свій torch у
    # межах kraken (не перекачує 2.5 ГБ); хмарний бокс ставить рівно цю — колесом
    # з індексу під свою карту (cu126 / cu128, як у `cuda_matrix` нижче), поверх
    # закешованого образу.
    reference: ["torch==2.14.0", "torchvision==0.29.1"]
    # Прискорення докладається окремим кроком за реальною картою. Індекс
    # обирається за compute capability, а не зашивається: cu126 під sm_75
    # (GTX 16xx / RTX 20xx) на новіших картах не працює взагалі.
    #
    # ⚠ Карту питає ДРАЙВЕР (`nvidia-smi`), а не torch: дефолтне колесо з PyPI
    # на Windows — `+cpu`, і питати в нього про CUDA означає питати того, хто за
    # побудовою не знає (issue #7).
    #
    # `min_driver` — мінімальна версія драйвера для колеса. Обидва теги — CUDA
    # 12.x, а вона їде на старішому драйвері за рахунок minor version
    # compatibility, якщо той не нижчий за 527.41 (Windows; на Linux межа нижча
    # — 525.60.13, тож число тут консервативне). Нижче цієї межі колесо стає й
    # мовчить до першого прогону, а тоді падає «CUDA driver version is
    # insufficient» — це відмова не про карту, і сказати про неї треба тут.
    #
    # Maxwell і Pascal (GTX 9xx/10xx, sm_50–sm_61) — те саме колесо cu126: його
    # набір архітектур `sm_50 sm_60 sm_61 sm_70 … sm_90` (звірено
    # `torch.cuda.get_arch_list()` на 2.13.0+cu126; між версіями набір лише
    # скорочується; у 2.10 це `sm_60`, код якого йде на 6.1 без перекомпіляції).
    # Замір 02.10.2026: GTX 1050 Ti (i5 8-го покоління, 32 ГБ) у Docker `:cuda`,
    # зразок 315-1-159 — 5.9 с/стор,
    # як GTX 1650 (5.8). cu128 Pascal уже не несе. `rent: "no"` — лише для власної
    # карти: орендувати таку машину під читання наглядач не бере.
    cuda_index: "https://download.pytorch.org/whl/{tag}"
    cuda_matrix:
      - {min_capability: "5.0", max_capability: "6.9", tag: "cu126", min_driver: "527.41", rent: "no"}
      - {min_capability: "7.0", max_capability: "8.9", tag: "cu126", min_driver: "527.41"}
      - {min_capability: "9.0", max_capability: "12.9", tag: "cu128", min_driver: "527.41"}
    # 🔴 Mac з процесором Intel (issue #10): PyTorch не випускає колес для
    # macOS x86_64 з torch 2.2.2, а kraken 7.1.1 вимагає ≥ 2.9 — з PyPI цю
    # пару не скласти ніколи. Її збирає conda-forge (pytorch osx-64 є й далі),
    # тож там середовище створює micromamba, а не `uv venv`: інтерпретатор і
    # torch — звідси, решта пакетів — pip'ом, як усюди. Межі 2.9…2.14 — межі
    # самого kraken 7.1.1. Приймач — CI `intel-mac.yml`.
    conda:
      channel: conda-forge
      packages: ["pytorch>=2.9,<=2.14", "torchvision"]

# ── патчі гарячих функцій kraken ─────────────────────────────────────────────
# Разом дають 32.7 → 14.8 с/стор при побітово тому самому виході. Це патч ЧУЖОЇ
# бібліотеки, тому кожен має верифікатор, який ганяє стару й нову версію
# пліч-о-пліч на живій сегментації і звіряє САМІ масиви. Окремо від них —
# `kraken_lineage_verify`: той самий раннер у двох середовищах (стара й нова
# версія kraken), побайтово сегментація й тексти. Лише після нього пара версій
# іде в `runner.SEG_LINEAGE`, і кеш сегментації переживає оновлення.
# `seg_ceiling` тут не стоїть: це не прискорення, а керована стеля рядків
# (`--max-endpoints`), і її поведінку покриває саме звірка родоводу.
patches:
  - id: gpu_sato
    module: nyshporka.htr.patches.gpu_sato
    verify: nyshporka.htr.patches.gpu_sato_verify
    tested_on: "kraken==7.1.1"
    requires_cuda: true
    gain: "×1.51 на сторінку (ridge-фільтр skimage.filters.sato → torch на карті)"
  - id: fast_geom
    module: nyshporka.htr.patches.fast_geom
    verify: nyshporka.htr.patches.fast_geom_verify
    tested_on: "kraken==7.1.1"
    requires_cuda: false
    gain: "×1.36 на сторінку (_calc_roi через STRtree, boundary_tracing скалярами)"
  - id: seg_resize
    module: nyshporka.htr.patches.seg_resize
    verify: nyshporka.htr.patches.seg_resize_verify
    tested_on: "kraken==7.1.1"
    requires_cuda: false
    gain: "−0.3…−0.5 с/стор на 16-Мпікс кадрах (один LANCZOS-ресайз замість двох)"
  - id: fast_order
    module: nyshporka.htr.patches.fast_order
    verify: nyshporka.htr.patches.fast_order_verify
    tested_on: "kraken==7.1.1"
    requires_cuda: false
    gain: "щільні таблиці: порядок читання 222 → 0.5 с (матриця numpy замість кубічного циклу)"
  - id: fast_seam
    module: nyshporka.htr.patches.fast_seam
    verify: nyshporka.htr.patches.fast_seam_verify
    tested_on: "kraken==7.1.1"
    requires_cuda: false
    gain: "етап polygon −21…−25% (шви рядків пакетом на сторінку)"
  - id: fast_clahe
    module: nyshporka.htr.patches.fast_clahe
    verify: nyshporka.htr.patches.fast_clahe_verify
    tested_on: "kraken==7.1.1"
    requires_cuda: true
    gain: "CLAHE блідих сторінок ×1.9 (інтерполяція відображень на карті)"
  # Дві нижче — не підміна коду kraken, а перетворення завантаженої PP-моделі
  # (`.safetensors`) у раннері. `pp_fuse` увімкнено, вимикач — `--no-pp-fuse`;
  # `pp_fp16` — лише з `--pp-precision fp16`, для заміру.
  - id: pp_fuse
    module: nyshporka.htr.patches.pp_fuse
    verify: nyshporka.htr.patches.pp_fuse_verify
    tested_on: "kraken==7.1.1"
    requires_cuda: false
    gain: "розпізнавання −7% на V100 (BatchNorm і гілки RepDWConv злито у згортки; текст побітово той самий)"
  - id: pp_fp16
    module: nyshporka.htr.patches.pp_fp16
    verify: nyshporka.htr.patches.pp_fp16_verify
    tested_on: "kraken==7.1.1"
    requires_cuda: true
    gain: "НЕМАЄ на справжніх сторінках: у 5.5 раза повільніше за fp32 (нова ширина рядка — новий вибір ядер); лише для заміру"

# ── рушії ────────────────────────────────────────────────────────────────────
# 🔴 Розширення моделі каже РУШІЙ, а префікс імені — ПИСЬМО. `.mlmodel` буває
# двох письм, і сплутати їх легко: невідповідність рушія письму дає тихе сміття
# без падіння впевненості.
#
# Рушій kraken має два формати ваг: `.mlmodel` (VGSL, старі Скриба й Дяк —
# читаються `load_any` + `predict_string`, як були) і `.safetensors` (PP-OCRv6,
# kraken ≥ 7.1 — Дяк-Літописець і Скриба-PP; читаються `kraken.tasks`). 🔴 Стару
# `.mlmodel` через `kraken.tasks` читати не можна: на тих самих кропах CER 43.3%
# замість 20.1% — шлях 7.1 інакше готує кроп для старих моделей.
engines:
  - id: skryba
    label: Скриба
    kind: kraken
    script: latin
    model_glob: ["skryba_*.mlmodel", "skryba_*.safetensors"]
    note: латинка — нотаріальні й костельні книги (Скриба-PP — на базі PP-OCRv6)

  - id: pysar
    label: Писар
    kind: parseq
    script: cyrillic
    model_glob: "pysar_*.pt"
    note: кирилиця — канцелярія, метрики, сповідки

  - id: diak
    label: Дяк
    kind: kraken
    script: cyrillic
    model_glob: ["diak_*.mlmodel", "diak_*.safetensors"]
    note: |
      Дяк-Літописець (`diak_cyr_v6.safetensors`) — нове покоління на базі
      PP-OCRv6. Другий голос: CTC прив'язаний до пікселів і калічить локально, тоді як
      PARSeq має внутрішню мовну модель і підставляє правдоподібне слово.

# ── базові моделі ────────────────────────────────────────────────────────────
base_models:
  - id: mccatmus
    doi: "10.5281/zenodo.13788177"
    filename: "McCATMuS_nfd_nofix_V1.mlmodel"
    note: |
      Generic-латинка XVI-XXI ст. (рукопис + друк). Фолбек, коли власної моделі
      немає, і база для файн-тюнів. Ставиться `kraken get`, кешується в
      профілі користувача — не в репозиторії.
