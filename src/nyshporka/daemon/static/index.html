<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111">
<title>Нишпорка</title>
<link rel="icon" href="/ui/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/ui/img/apple-touch-icon.png">
<!--
  🔴 Тема ставиться ДО завантаження CSS. Модуль `theme.js` виконується вже після
  парсингу <head>, тобто після того, як браузер намалював перший кадр — при
  світлому виборі людина побачила б спалах темного. Дубль логіки тут свідомий;
  ключ і порядок рішень збігаються з `themeMode()` у `/ui/theme.js`, і міняти їх
  треба в обох місцях.
-->
<script>
(function () {
  var k = 'nyshporka.theme', v = null;
  try { v = localStorage.getItem(k); } catch (e) { /* приватний режим */ }
  if (v !== 'light' && v !== 'dark') {
    v = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = v;
  document.querySelector('meta[name="color-scheme"]').setAttribute('content', v);
})();
</script>
<!--
  Порядок обов'язковий: `fonts.css` оголошує шрифти з пакета, `tokens.css` несе самі змінні (згенеровано з
  `brand.yaml`), `base.css` — примітиви спільного шару, `app.css` — те, що є
  тільки в цієї морди. Зворотний порядок лишив би верстку без кольорів на
  перший кадр, а власні правила — без змоги перебити базові.
-->
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<!--
  🔴 Токен вшивається сюди сервером і живе в `data-token`. Не cookie: cookie
  браузер шле сам, і тоді будь-яка чужа вкладка змогла б мутувати простір через
  localhost. Тут заголовок ставить лише наш код.
-->
<body data-token="{{TOKEN}}">
<!--
  Спрайт значків вставляє сервер (`nyshporka.ui.with_sprite`). Файлом його
  підключити не можна: `<use href>` до зовнішнього SVG забороняє успадкування
  currentColor у Chrome, і значки стали б чорними плямами на темному полотні.
-->
{{SPRITE}}
<div id="app">
<header>
  <!-- ☰ — бічне меню на вузькому екрані (`side.toggle`); на широкому кнопки немає. -->
  <button type="button" class="side-btn" data-act="side.toggle" aria-controls="side"
    aria-expanded="false" data-i18n-title="side.menu"><svg class="ic ic-o" aria-hidden="true"><use href="#i-menu"/></svg></button>
  <!--
    🦦 Логотип порталу: маскот і назва. Файл лежить у пакеті (`/ui/img`), тож
    в архіві без інтернету він на місці. Пульсує, поки в черзі є робота
    (`nav.js`), — це стан ПРОЦЕСУ, а не результату.
  -->
  <!-- Лого веде на портал (Супряга, документація), а не на код: людина
       з консолі шукає людей і справи, а не репозиторій. -->
  <a class="brand logo" href="https://nyshporka.online/"
     target="_blank" rel="noopener" title="Нишпорка — портал nyshporka.online">
    <img class="logo-img" src="/ui/img/logo.webp" alt="Нишпорка" width="132" height="42">
  </a>
  <!--
    🔴 Проєкт вкладки видно завжди, а не в закритому списку: людина мусить
    бачити, в якому роді працює, ще до першого кліку (макет хвилі 6). Кнопка
    з'являється лише в Майстерні (`core/header.js`); у просторі старого типу
    шапка та сама, що й була.
  -->
  <div class="hmenu proj" id="proj-box" hidden>
    <button type="button" class="ctx-btn" data-act="menu.toggle" data-arg="proj-menu"
      aria-haspopup="true" aria-expanded="false"><span class="ctx-badge" id="proj-badge"></span>
      <span class="ctx-t"><small id="proj-k"></small><b id="proj-v"></b></span><span class="chev" aria-hidden="true"></span></button>
    <div class="hmenu-pop" id="proj-menu" hidden></div>
  </div>
  <!-- «Що зробити?» — консольний `nysh ops find`; клавіша `/`. -->
  <button type="button" class="ask" data-act="ask.open"><span class="ask-ic">⌕</span>
    <span data-i18n="ask.ph">Що зробити?</span><kbd>/</kbd></button>
  <!-- «Працює N» — що зараз іде; ховається, коли нічого. -->
  <div class="hmenu">
    <button type="button" class="chip" id="jobs-chip" data-act="menu.toggle" data-arg="jobs-menu"
      aria-haspopup="true" aria-expanded="false" hidden><span class="pulse"></span>
      <span data-i18n="jobs.chip">Працює</span> <b id="jobs-n">0</b></button>
    <div class="hmenu-pop right" id="jobs-menu" hidden></div>
  </div>
  <!--
    🔔 Новини: вийшла версія, нові моделі, сповіщення Супряги. Крапка — лише
    коли є що сказати; сама консоль у мережу не йде, поки людина не ввімкне
    перевірку (Налаштування → Мережа, PRIVACY.md).
  -->
  <div class="hmenu">
    <button type="button" class="bell" id="bell-chip" data-act="menu.toggle" data-arg="bell-menu"
      aria-haspopup="true" aria-expanded="false" data-i18n-title="bell.title"><svg class="ic ic-o" aria-hidden="true"><use href="#i-bell"/></svg><b class="bell-n" id="bell-n" hidden></b></button>
    <div class="hmenu-pop right bell-pop" id="bell-menu" hidden></div>
  </div>
  <!-- Профіль Супряги: хто ви в спільноті й скільки віддано. -->
  <div class="hmenu">
    <button type="button" class="chip" id="me-chip" data-act="menu.toggle" data-arg="me-menu"
      aria-haspopup="true" aria-expanded="false" hidden><span class="avatar" id="me-av">·</span>
      <span class="me-t" id="me-t"></span></button>
    <div class="hmenu-pop right" id="me-menu" hidden></div>
  </div>
  <!--
    ⚙ — мова, тема й налаштування в одному меню: у верхній панелі лише те, що
    потрібне з будь-якого екрана (правила інтерфейсу, 22.10.2026).
  -->
  <div class="hmenu">
    <button type="button" class="gear" data-act="menu.toggle" data-arg="set-menu"
      aria-haspopup="true" aria-expanded="false" data-i18n-title="nav.settings"><svg class="ic ic-o" aria-hidden="true"><use href="#i-settings"/></svg></button>
    <div class="hmenu-pop right" id="set-menu" hidden>
      <label class="hm-row"><small data-i18n="set.lang">Мова</small>
        <select class="lang" id="lang-sel" data-act="lang.set"></select></label>
      <!--
        Перемикач теми. Значок показує ПОТОЧНИЙ режим, а не той, у який перемкне:
        інакше стан «за системою» нічим показати, і кнопка перестає бути
        індикатором. Наповнення ставить `theme.js`.
      -->
      <div class="hm-row hm-line"><small data-i18n="set.theme">Тема</small>
        <button class="thm" id="theme-btn" data-act="theme.cycle"></button></div>
      <div class="sep"></div>
      <button type="button" data-act="nav" data-arg="settings"><span data-i18n="nav.settings">Налаштування</span></button>
    </div>
  </div>
</header>
<!--
  🪟 Вікно поверх екрана (`core/modal.js`). 🔴 Стоїть ПЕРЕД `<main>`: екрани шукають
  свої вузли за `id`, і екран у вікні мусить знаходитись першим, а не той, що під ним.
-->
<dialog class="modal" id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head"><b id="dlg-title"></b>
    <button type="button" class="ghost" data-act="modal.close" aria-label="✕">✕</button></div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>
<div id="shell">
  <!--
    🔴 Пункти меню СТАВИТЬ JS із `/api/sections`, а не розмітка: частину
    застосунку вимикають профілем простору, і другий, зашитий тут перелік
    розходився б із дозволеним тихо — кнопкою, що веде в порожнечу.
    Блоки — за тим, де живуть дані: рід, Майстерня, спільне, сервіс.
  -->
  <aside id="side" class="side"></aside>
  <div class="side-shade" data-act="side.toggle"></div>
  <!-- Заголовок сторінки (`nav.renderHead`) — поза `#view`: екран його не перемальовує. -->
  <main><div id="phead" class="phead"></div><div id="view"></div></main>
</div>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
