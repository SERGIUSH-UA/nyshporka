<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111">
<title>Нишпорка</title>
<link rel="icon" href="/ui/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/ui/img/apple-touch-icon.png">
<!--
  🔴 Тема ставиться ДО завантаження CSS. Модуль `theme.js` виконується вже після
  парсингу <head>, тобто після того, як браузер намалював перший кадр — при
  світлому виборі людина побачила б спалах темного. Дубль логіки тут свідомий;
  ключ і порядок рішень збігаються з `themeMode()` у `/ui/theme.js`, і міняти їх
  треба в обох місцях.
-->
<script>
(function () {
  var k = 'nyshporka.theme', v = null;
  try { v = localStorage.getItem(k); } catch (e) { /* приватний режим */ }
  if (v !== 'light' && v !== 'dark') {
    v = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = v;
  document.querySelector('meta[name="color-scheme"]').setAttribute('content', v);
})();
</script>
<!--
  Порядок обов'язковий: `fonts.css` оголошує шрифти з пакета, `tokens.css` несе самі змінні (згенеровано з
  `brand.yaml`), `base.css` — примітиви спільного шару, `app.css` — те, що є
  тільки в цієї морди. Зворотний порядок лишив би верстку без кольорів на
  перший кадр, а власні правила — без змоги перебити базові.
-->
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<!--
  🔴 Токен вшивається сюди сервером і живе в `data-token`. Не cookie: cookie
  браузер шле сам, і тоді будь-яка чужа вкладка змогла б мутувати простір через
  localhost. Тут заголовок ставить лише наш код.
-->
<body data-token="{{TOKEN}}">
<!--
  Спрайт значків вставляє сервер (`nyshporka.ui.with_sprite`). Файлом його
  підключити не можна: `<use href>` до зовнішнього SVG забороняє успадкування
  currentColor у Chrome, і значки стали б чорними плямами на темному полотні.
-->
{{SPRITE}}
<div id="app">
<header>
  <!--
    🦦 Логотип порталу: маскот і назва. Файл лежить у пакеті (`/ui/img`), тож
    в архіві без інтернету він на місці. Пульсує, поки в черзі є робота
    (`nav.js`), — це стан ПРОЦЕСУ, а не результату.
  -->
  <a class="brand logo" href="https://github.com/SERGIUSH-UA/nyshporka"
     target="_blank" rel="noopener" title="Нишпорка на GitHub">
    <img class="logo-img" src="/ui/img/logo.webp" alt="Нишпорка" width="132" height="42">
  </a>
  <!--
    🔴 Кнопки СТАВИТЬ JS із `/api/sections`, а не розмітка. Причина не в
    зручності: частину застосунку вимикають профілем простору, і другий,
    зашитий тут перелік розходився б із дозволеним тихо — виглядало б це як
    кнопка, що веде в порожнечу, або як зникла без пояснення.

    Два яруси: `.tabs` — розділи (секції), `.subtabs` — екрани активного
    розділу. Одним рядом їх було дванадцять, і на вузькому екрані ряд
    перетворювався на стіну без ієрархії.
  -->
  <nav id="nav" class="tabs"></nav>
  <button class="lang" data-act="lang.toggle" title="uk / en">🌐</button>
  <button class="lang" data-act="nav" data-arg="settings" title="Налаштування">⚙</button>
  <!--
    Перемикач теми. Значок показує ПОТОЧНИЙ режим, а не той, у який перемкне:
    інакше стан «за системою» нічим показати, і кнопка перестає бути
    індикатором. Наповнення ставить `theme.js`.
  -->
  <button class="thm" id="theme-btn" data-act="theme.cycle"></button>
</header>
<nav id="subnav" class="subtabs"></nav>
<main id="view"></main>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
