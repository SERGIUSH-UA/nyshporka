# 🐾 Айдентика Нишпорки — ЄДИНЕ джерело правди.
#
# Звідси генеруються: токени фронту (`daemon/static/tokens.css`), тема
# командного рядка (`brand.console`) і оформлення сайту документації
# (`docs/stylesheets/brand.css`). Руками жоден із трьох не правиться.
#
# 🔴 Причина не косметична. Колір `#7a4f2b` уже лежав переписаний вручну в
# CSS, а `rich.Console()` створювався незалежно в П'ЯТИ модулях — тобто
# «однаковий вигляд» тримався тільки на пам'яті того, хто правив останнім.
# Розходження такого роду тихі: ніщо не падає, просто через півроку командний
# рядок, застосунок і сайт виглядають як три різні продукти. Тест
# `tests/test_brand.py` звіряє згенероване з цим файлом і не дає їм розійтись.

version: 1

# ── хто така Нишпорка ────────────────────────────────────────────────────────
# Кіт, який приносить знайдене з архіву. Лапка — слід у справі, лупа в
# подушечці — те, що вона робить.
#
# 🔴 Знак НІКОЛИ не повідомляє результат замість тексту. «Сумного кота» на
# порожній видачі бути не може: нуль без знаменника — не результат, і картинка,
# яка каже «нічого немає», бреше рівно там, де ціна помилки найвища (хибне
# «немає» закриває напрям пошуку назавжди). Стани знака описують ПРОЦЕС
# (спокій · шукає · готово), а не ВИСНОВОК.
identity:
  name_uk: Нишпорка
  name_en: Nyshporka
  line_uk: Читає рукопис. Приносить знайдене.
  line_en: Reads the hand. Brings back what it found.
  mascot: cat
  mark: paw            # лапка з лупою в центральній подушечці

# ── палітра ──────────────────────────────────────────────────────────────────
# Значення — ті самі, що вже стояли в `app.css`: реліз не змінює вигляду
# наосліп, кольори лише дістають імена й одне місце проживання.
#
# 🔴 Дві теми обов'язкові. Застосунок відкривають на ноутбуці в читальній залі
# архіву, і біле полотно в темній залі читається гірше за скан.
#
# `css` — ім'я змінної у фронті. Воно лишається коротким (`--bg`), бо його
# набирають у верстці руками; семантичне ім'я (`paper`) живе тут.
palette:
  - id: paper
    css: bg
    why: полотно сторінки
    light: "#fbfaf7"
    dark: "#1b1a18"
  - id: ink
    css: fg
    why: основний текст
    light: "#23201c"
    dark: "#e8e3da"
  - id: muted
    css: muted
    why: другорядне — підказки, заголовки колонок
    # ⚠ Було `#7a736a` — і давало 4.48 на полотні при порозі AA 4.5. Вада
    # приїхала з рукописного CSS і оком не видима: не «сірий текст нечитабельний»,
    # а «нечитабельний рівно на межі», тобто на поганому екрані в архіві. Тут
    # лежить половина підказок і всі заголовки колонок, тож колір затемнено до
    # найближчого, що проходить із запасом (4.75). Знайдено вимірювачем при
    # заведенні палітри, не оком.
    light: "#766f66"
    dark: "#9a938a"
  - id: line
    css: line
    why: межі, рамки, розділювачі
    light: "#e3ded4"
    dark: "#34312c"
  - id: sepia
    css: accent
    why: акцент бренду — кнопки, активна вкладка, сам знак
    light: "#7a4f2b"
    dark: "#d3a06a"
  - id: card
    css: card
    why: підкладка картки й поля вводу
    light: "#ffffff"
    dark: "#232120"
  - id: warn_bg
    css: warn-bg
    why: підкладка попередження
    light: "#fff6e0"
    dark: "#3a3320"
  - id: warn_fg
    css: warn-fg
    why: текст попередження
    light: "#6b4d00"
    dark: "#f0d79a"
  - id: err
    css: err
    why: відмова, червоний приймач
    light: "#a32b2b"
    dark: "#ff8a8a"
  - id: ok
    css: ok
    why: зелений приймач — крок доведено
    # Мох, а не «зелений з коробки»: чистий green поряд із сепією виглядає
    # чужим, і на темному тлі терміналу він же нечитабельний. Тримається за
    # 107° від відмови й за 64° від патини Дяка — жодну з них не імітує.
    light: "#3f6b33"
    dark: "#8fc47a"

# ── типографіка ──────────────────────────────────────────────────────────────
# 🔴 Тільки системні стеки. Жодного CDN і жодного зовнішнього шрифту:
# застосунок працює офлайн — в архіві інтернету може не бути взагалі, а шрифт,
# який не приїхав, дає стрибок верстки саме там, де людина читає скан.
type:
  text: 'system-ui, "Segoe UI", sans-serif'
  mono: 'ui-monospace, Consolas, monospace'
  base_size: 15px
  line_height: "1.5"

# ── позначки ─────────────────────────────────────────────────────────────────
# Той самий словник, що в шапці `AGENTS.md`. Досі він жив прозою в трьох
# файлах, тож означати міг що завгодно.
marks:
  - id: rule
    glyph: "🔴"
    uk: правило, яке не обговорюється
    en: non-negotiable rule
  - id: trap
    glyph: "⚠"
    uk: пастка, що коштувала прогону
    en: trap that has cost a run
  - id: check
    glyph: "✅"
    uk: приймач — чим доводиться, що крок зроблено
    en: acceptance check
  - id: human
    glyph: "🛑"
    uk: межа, за якою вирішує людина
    en: boundary where a human decides

# ── три рушії читання ────────────────────────────────────────────────────────
# 🔴 Візуал живе ТУТ, а не в `htr/data/engines.yaml`. Той файл — маніфест
# середовища (піни версій, пакети, патчі kraken), і колірний токен у ньому
# чужий: правка оформлення не має чіпати файл, від якого залежить, чи
# запуститься читання. Що обидві множини `id` збігаються — доводить тест, а не
# домовленість.
#
# 🔴 Колір — ПРИСКОРЮВАЧ, а не носій. Вивід читають у чорно-білому терміналі,
# у логах і з дальтонізмом, тож кожен рушій має ще форму й літеру. Якщо колір
# зникне, розрізнення лишиться.
#
# Логіка кольору: ПИСЬМО задає родину. Писар і Дяк — сусідні холодні відтінки,
# бо це два голоси ОДНОГО письма (їх і звіряють між собою); Скриба стоїть
# окремо, бо в нього окреме письмо й окремий матеріал.
#
# Імена не перекладаються: це власні імена моделей, які стоять в іменах файлів
# (`pysar_cyr_v*.pt`). Перекладається лише роль.
engines:
  - id: pysar
    order: 1
    letter_uk: "П"
    letter_en: "P"
    shape: circle
    hue_uk: чорнило
    light: "#3a4a86"
    dark: "#9db4e0"
    role_uk: "головний голос: канцелярія, метрики, сповідки"
    role_en: "main voice: chancery, metric books, confessional lists"
  - id: diak
    order: 2
    letter_uk: "Д"
    letter_en: "D"
    shape: diamond
    hue_uk: патина
    light: "#2c645c"
    dark: "#79c7b9"
    role_uk: "другий голос: тримається пікселів там, де перший додумує"
    role_en: "second voice: stays with the pixels where the first one guesses"
  - id: skryba
    order: 3
    letter_uk: "С"
    letter_en: "S"
    shape: notched
    hue_uk: слива
    # ⚠ Зсунуто в бік магенти з чистого фіолету (`#6a4486`): той стояв за 47°
    # від синього Писаря, а синій і фіолетовий — рівно та пара, яку зливає
    # дейтеранопія. Тепер 61° від Писаря і 72° від відмови — далі вести не
    # можна, бо магента почала б сходитись із червоним приймачем.
    light: "#733f80"
    dark: "#c9a0d9"
    role_uk: "латинка: нотаріат і костельні книги"
    role_en: "Latin script: notarial and Roman Catholic books"

# ── знаки секцій застосунку ──────────────────────────────────────────────────
# 🔴 Ідуть даними, а не розміткою. Кнопки навігації будує JS із `/api/sections`,
# і другий, зашитий у HTML перелік розходився б тихо — виглядало б це як кнопка,
# що веде в порожнечу. Перелік звіряється з `core.sections.SECTIONS` тестом.
section_glyphs:
  core: "🐾"
  material: "🏛"
  htr: "🖋"
  research: "🔎"
  lab: "🧪"

# ── знаки екранів (кнопки навігації) ─────────────────────────────────────────
# 🔴 Навігація йде за ЕКРАНАМИ, не за секціями: секція вмикає групу екранів, і
# кнопок у шапці дванадцять, а секцій п'ять. Тому знаки тут окремі — інакше
# половина кнопок лишилась би без іконки поряд із оформленими.
#
# Перелік звіряється з `NAV_ORDER` у фронті тестом: якби додався екран без
# знака, кнопка виглядала б зламаною, а зайвий знак лишався б мертвим рядком.
screen_glyphs:
  home: "🐾"
  sources: "📚"
  geog: "🗺"
  fonds: "🏛"
  cases: "📂"
  newcase: "➕"
  read: "🖋"
  view: "📄"
  eye: "👁"
  search: "🔎"
  export: "📤"
  jobs: "⏳"

# ── геометрія знака ──────────────────────────────────────────────────────────
# 🔴 Лапка описана ДАНИМИ, а не намальована у файлі. Причина конкретна: поруч із
# SVG потрібен РАСТР — обкладинку репозиторію GitHub приймає тільки картинкою
# (PNG/JPG), та й знак у README надійніше давати растром, бо різні рендерери
# поводяться з SVG по-різному. Намальовані окремо, вони розійшлися б при першій
# же правці й показували б різний знак у застосунку та на сторінці пакета.
#
# Усе — еліпси, і це навмисно: складніший силует не пережив би 16 px у вкладці,
# а простий однаково читається і в фавіконці, і на обкладинці 1280×640.
#
# Лупа — НАСКРІЗНИЙ отвір у подушечці, а не другий колір: так знак лягає на
# будь-яке тло, не тягнучи за собою другого токена.
mark_geometry:
  size: 32
  toes:
    - {cx: 7.4, cy: 12.6, rx: 2.7, ry: 3.4, rot: -24}
    - {cx: 13.2, cy: 8.4, rx: 2.8, ry: 3.6, rot: -8}
    - {cx: 19.4, cy: 8.4, rx: 2.8, ry: 3.6, rot: 8}
    - {cx: 24.8, cy: 12.6, rx: 2.7, ry: 3.4, rot: 24}
  pad: {cx: 16, cy: 22.2, rx: 10.3, ry: 6.9}
  lens: {cx: 15.8, cy: 21.8, r: 3.6}
  # Ручка лупи. Тримається ВСЕРЕДИНІ подушечки: коли вона вилазила за край,
  # отвір прорізав контур і знак читався як надщерблений, а не як лупа.
  # У фавіконці не малюється взагалі — на 16 px вона зливається в пляму, а
  # кільце саме по собі вже читається як «шукає».
  handle: {x1: 18.4, y1: 24.2, x2: 20.8, y2: 25.9, w: 2.1}
