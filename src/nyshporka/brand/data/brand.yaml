# ── значки спрайта: те саме, що гліфи, але лінією ────────────────────────────
# 🔴 Емодзі й значок несуть ОДНЕ й те саме, і живуть поруч навмисно. Емодзі
# лишається для командного рядка й README, де спрайта немає; значок — для
# застосунку, бо емодзі має власну палітру й на помаранчевій активній вкладці
# лишається різнобарвною плямою, тоді як `<use>` бере `currentColor` і сам
# набуває колір кнопки.
#
# ⚠ Ім'я мусить існувати у спрайті: помилка друку дає ПОРОЖНЄ місце без жодної
# помилки в консолі — `<use>` на неіснуючий id мовчить. Звіряє приймач.
