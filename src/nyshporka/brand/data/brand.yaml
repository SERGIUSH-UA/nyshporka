# 🐾 Айдентика Нишпорки — ЄДИНЕ джерело правди.
#
# Звідси генеруються: токени фронту (`ui/static/tokens.css`), тема командного
# рядка (`brand.console`) і оформлення сайту документації
# (`docs/stylesheets/brand.css`). Руками жоден із трьох не правиться.
#
# 🔴 Причина не косметична. Колір `#7a4f2b` уже лежав переписаний вручну в CSS,
# а `rich.Console()` створювався незалежно в П'ЯТИ модулях — тобто «однаковий
# вигляд» тримався тільки на пам'яті того, хто правив останнім. Розходження
# такого роду тихі: ніщо не падає, просто через півроку командний рядок,
# застосунок і сайт виглядають як три різні продукти. Тест `tests/test_brand.py`
# звіряє згенероване з цим файлом і не дає їм розійтись.
#
# ⚠ Файл виріс із 15 кольорів до 128 токенів (2026-08-24). Доти застосунок і
# консоль дослідника мали дві НЕЗАЛЕЖНІ палітри, і та, що більша, за півтора
# року набула речей, яких тут просто не було: розчепленого акценту, ярусу
# поверхонь, ролевих тонів, тонів значків. Копіювати їх у другий файл означало б
# завести те саме тихе розходження вдруге, тож джерело лишилось одне, а виросло.

version: 2

# ── хто така Нишпорка ────────────────────────────────────────────────────────
# Кіт, який приносить знайдене з архіву. Лапка — слід у справі, лупа в
# подушечці — те, що вона робить.
#
# 🔴 Знак НІКОЛИ не повідомляє результат замість тексту. «Сумного кота» на
# порожній видачі бути не може: нуль без знаменника — не результат, і картинка,
# яка каже «нічого немає», бреше рівно там, де ціна помилки найвища (хибне
# «немає» закриває напрям пошуку назавжди). Стани знака описують ПРОЦЕС
# (спокій · шукає · готово), а не ВИСНОВОК.
identity:
  name_uk: Нишпорка
  name_en: Nyshporka
  line_uk: Читає рукопис. Приносить знайдене.
  line_en: Reads the hand. Brings back what it found.
  mascot: cat
  mark: paw            # лапка з лупою в центральній подушечці

# ── яка тема базова ──────────────────────────────────────────────────────────
# 🔴 ТЕМНА, і це перевертає те, як було. Раніше базовою стояла світла, а темна
# приходила лише з системної налаштованості; тепер темна — те, що видно за
# замовчуванням, а світла ПЕРЕВИЗНАЧАЄ ті самі імена під `[data-theme="light"]`.
#
# Причина в тому, як застосунком користуються. Справу читають годинами, і
# полотно кольору паперу на весь екран стомлює рівно тоді, коли роботи найбільше.
#
# Палітра в застосунку й на порталі nyshporka.online ОДНА: темна тема — «вечірня
# бібліотека» (глибока бірюза #14201D, мед як акцент), світла — «папір» (кремовий
# #F5EDDC, бірюза як дія, мед як позначка). Портал за замовчуванням світлий, а
# застосунок темний; обидва перемикаються одним кліком.
theme_default: dark

# ── палітра ──────────────────────────────────────────────────────────────────
# 🔴 Дві теми обов'язкові, і кожен КОЛЬОРОВИЙ токен мусить мати пару. Токен без
# пари лишається темною плямою на світлому тлі — це не гіпотеза, а те, що вже
# ловив приймач. Виняток оголошується явно, полем `same: true`, і кожен такий
# випадок пояснений: інакше «забув» і «так задумано» виглядають однаково.
#
# `css` — ім'я змінної у фронті. Воно лишається коротким (`--bg`, `--s-3`), бо
# його набирають у верстці руками; що воно означає, каже `why`.
#
# ⚠ Імена НЕ семантичні за кольором (`s-3`, а не `dark-grey`) — саме тому, що у
# світлій темі відтінок протилежний, а роль та сама.
palette:
  - group: surfaces
    title: "поверхні: сходинка від найглибшої (лог) до піднятої (кнопки)"
    why: |
      Значення ті самі, що в групі `portal` (`pt-*`), — застосунок і портал
      мають один папір. Ярусів у застосунку більше (лог, другорядні смуги), тож
      проміжні щаблі взято між сусідніми щаблями порталу, з того самого тону.
      У темній «вище = світліше». У світлій хром (`s-0`) і контроли (`s-3`)
      світліші за папір сторінки, а смуги (`s-1`, `s-4`) — темніші, як на порталі.
    colors:
      - {css: s-log, why: "лог, найглибше тло", dark: "#0B1412", light: "#F1E7D3"}
      - {css: s-0, why: "хром: шапка, липкі тулбари, шапки модалок", dark: "#0F1917", light: "#F9F4EA"}
      - {css: s-1, why: "другорядні смуги, дашборди, картки-списки", dark: "#121D1A", light: "#EFE3CC"}
      - {css: bg, why: "тло сторінки", dark: "#14201D", light: "#F5EDDC"}
      - {css: s-2, why: "картки-секції", dark: "#1A2824", light: "#FBF7EF"}
      - {css: s-3, why: "контролі, інпути, картки контенту", dark: "#1E2E2A", light: "#FFFDF8"}
      - {css: s-4, why: "підняті кнопки, треки прогресу", dark: "#2E423C", light: "#E8D9BE"}

  - group: lines
    title: "лінії: чотири сили розділення"
    why: |
      У темній сила = світліше, у світлій = темніше.
    colors:
      - {css: line, why: "найтихіша: розділювачі всередині блока", dark: "#2C3D38", light: "#E2D4BA"}
      - {css: line-2, why: "рамка картки", dark: "#3A4E48", light: "#CDBB9B"}
      - {css: line-3, why: "рамка контрола", dark: "#55695F", light: "#A8977A"}
      - {css: line-4, why: "рамка при ховері", dark: "#6B8076", light: "#8A7A5E"}

  - group: text
    title: "текст: шість щаблів тиші"
    why: |
      Перші чотири — `pt-fg`…`pt-fg-4` порталу. `fg-5` і `fg-6` (підказки,
      плейсхолдери) — тихіші за них і лише для дрібного другорядного.
      Контраст до тла: темна 13.8 · 10.8 · 7.3 · 6.1 · 3.9 · 4.7,
      світла 12.3 · 8.4 · 6.2 · 5.0 · 3.8 · 4.3.
    colors:
      - {css: fg, why: "основний", dark: "#F1E8D6", light: "#1F2D2A"}
      - {css: fg-2, why: "другорядний", dark: "#D9CFBC", light: "#3A4642"}
      - {css: fg-3, why: "приглушений (метадані, підписи)", dark: "#B3AA97", light: "#4B5B55"}
      - {css: fg-4, why: "ще тихіший", dark: "#A39C8B", light: "#6A6557"}
      - {css: fg-5, why: "натяки, підказки, плейсхолдери", dark: "#7F796C", light: "#7E7866"}
      - {css: fg-6, why: "між --fg-4 і --fg-5; 29 місць хардкоду", dark: "#8E887A", light: "#74705F"}
      - {css: white, why: "чорнило НА кольоровій заливці", value: "#fff", same: true}

  - group: accent
    title: "акцент: РОЗЧЕПЛЕНИЙ на дві ролі"
    why: |
      Як на порталі: у темній акцент — мед (`pt-honey` заливкою, `pt-honey-ink`
      чорнилом), у світлій — глибока бірюза (`pt-primary`), а мед лишається
      позначкою (`accent-2`, тло попереджень).
      🔴 Ролі розчеплені, бо мед як ЧОРНИЛО на папері нечитабельний, а як
      ЗАЛИВКА мусить лишитись медом. Правило вживання: `color:` і `border-color:`
      беруть `accent`, `background:` бере `accent-fill`. Приймач тримає це в тестах.
    colors:
      - {css: accent, why: "фірмовий помаранчевий: ЧОРНИЛО й рамки", dark: "#E8B872", light: "#0F3D3A"}
      - {css: accent-fill, why: "той самий: ЗАЛИВКА (активна вкладка, шкала)", dark: "#E3A64B", light: "#0F3D3A"}
      - {css: accent-ink, why: "чорнило НА заливці акценту", dark: "#14201D", light: "#F5EDDC"}
      - {css: accent-2, why: "світліший акцент: бенди, попередження", dark: "#EDBB6D", light: "#85560F"}
      - {css: accent-bg, why: "тло активного акцентного елемента", dark: "#2B2E21", light: "#F7E6C6"}
      - {css: honey, why: "мед однаковий в обох темах: підкреслення активного розділу, смуги прочитаного", value: "#E3A64B", same: true}

  - group: semantic
    title: "семантика станів"
    why: |
      Стан говорить кольором ще до підпису; тонові тла — для смуг і плашок.
    colors:
      - {css: info, why: "підписи полів, посилання-дії", dark: "#9ad7ff", light: "#10618f"}
      - {css: info-2, why: "інформаційне, друга сила", dark: "#64b5f6", light: "#1668ad"}
      - {css: link, why: "кнопка-дія", dark: "#2196f3", light: "#0f62b0"}
      - {css: ok, why: "ствердне", dark: "#7CC47F", light: "#256B2A"}
      - {css: ok-2, why: "ствердне, тихіше", dark: "#81c784", light: "#1f6b2a"}
      - {css: ok-3, why: "ствердне, найтихіше", dark: "#a5d6a7", light: "#17572a"}
      - {css: warn, why: "попередження", dark: "#ff9800", light: "#a35a00"}
      - {css: err, why: "відмова", dark: "#F08A80", light: "#B3372F"}
      - {css: err-2, why: "відмова, тихіше", dark: "#ef9a9a", light: "#a32424"}
