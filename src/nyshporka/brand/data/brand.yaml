      🔴 У світлій темі вони ПЕРЕРАХОВАНІ, а не перевернуті: пастель L*≈75 на білому
      зливається в один блідий контур так само, як монохром зливався в один сірий.
      Там вони темніші при збереженому ТОНІ, усі в межах 4.6-6.2:1.
    colors:
