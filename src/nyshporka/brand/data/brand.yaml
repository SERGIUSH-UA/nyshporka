      - {css: magenta, why: "активний конфузер", dark: "#e040fb", light: "#a3168f"}
      - {css: ok-bg, why: "тло успіху", dark: "#1B2E21", light: "#E4F0E1"}
      - {css: ok-line, why: "рамка успіху", dark: "#2e7d32", light: "#a9d3ab"}
      - {css: err-bg, why: "тло помилки", dark: "#33201D", light: "#F8E3DE"}
      - {css: err-line, why: "рамка помилки", dark: "#8b3838", light: "#e3b0b0"}
      - {css: info-bg, why: "тло інформації", dark: "#102028", light: "#eaf3fb"}
      - {css: info-line, why: "рамка інформації", dark: "#2e4651", light: "#b7d3ea"}

  - group: roles
    title: "ролеві тони: назва каже РОЛЬ, а не відтінок"
    why: |
      Кожен замінив 5-23 входження хардкоду. У світлій темі відтінок інший, а роль
      та сама — саме тому імена не кольорові.
    colors:
      - {css: ok-soft, why: "«хіт / бойова версія» — приглушено-зелений", dark: "#7fbf9f", light: "#2f7a58"}
      - {css: ok-solid, why: "ЗАЛИВКА ствердного бейджа («★ у каноні»)", dark: "#2d7d2d", light: "#2e7d32"}
      - {css: err-solid, why: "ЗАЛИВКА застережного бейджа (holdout, danger)", dark: "#7a2e2e", light: "#b3383c"}
      - {css: mint-2, why: "«дефіциту немає» — світло-мʼятний", dark: "#8ff0b8", light: "#0f7a4e"}
      - {css: warn-2, why: "«поки триває» — приглушено-жовтий", dark: "#e0b050", light: "#8a6410"}
