# 🏛 Знання про архіви — дані, а не константи в коді.
#
# Усе нижче — те, що конкретний дослідник дізнається про фонд і мусить кудись
# записати: як архів скорочують, чи входить опис у ключ справи, який опис мають
# скановані теки за замовчуванням, до якої губернії фонд належить за визначенням.
#
# Досі це лежало словниками в `library.py` і `cases/geo.py`, тобто новий архів
# можна було додати лише правкою коду. Тепер — рядком сюди.
#
# 🔴 Кожен запис має підставу. Порожній `note` означає «очевидно з назви фонду»;
# де не очевидно — написано, ЧОМУ саме так, бо через півроку це вже не відновити.

version: 1

# ── архіви ───────────────────────────────────────────────────────────────────
repositories:
  DAHMO:
    label: ДАХмО
    name: Державний архів Хмельницької області
    country: UA
    sites:
      archium:
        url: https://archium.dahmo.gov.ua
        # 🔴 Історичне ім'я джерела, і міняти його не можна: воно стоїть у
        # довідці (`nysh crawl archium`), у полі «де шукали» кожної відповіді й
        # у вкладеному зрізі каталогу на 9020 справ.
        source_id: archium
        bundled: dahmo_archium_cases.tsv.gz
        groups:
          - {id: "1", label: "Фонди давніх актів (1739-1921)"}
          - {id: "2", label: "Фонди радянського періоду"}
          - {id: "3", label: "Фонди особового походження"}
          - {id: "4", label: "Колекції"}
    codes:
      duck: ДАХмО
      commons: ДАХмО
    # Довге написання трапляється в шифрах, набраних руками.
    aliases: [ДАХмельнО]
  CDIAK:
    label: ЦДІАК
    name: Центральний державний історичний архів України, м. Київ
    country: UA
    sites:
      archium:
        url: https://archium.cdiak.archives.gov.ua
        # 🔴 Груп фондів тут НЕМАЄ: `/api/v1/fond-groups/` цього майданчика
        # віддає 500. Без цієї позначки перегляд показав би чотири групи
        # сусіднього архіву — чуже дерево під іменем цього.
        fond_groups: false
    codes:
      duck: ЦДІАК
      commons: ЦДІАК
    aliases: [ЦДІАУК]
  DAVIO:
    # 🔴 Канонічний код архіву — саме `DAVIO`, і збігається він зі скороченням,
    # яким архів зветься насправді: голого «ДАВО» серед архівів України НЕМАЄ
    # ЗОВСІМ (Вінницька — ДАВіО, Волинська — ДАВоО).
    label: ДАВіО
    name: Державний архів Вінницької області
    country: UA
    codes:
      duck: ДАВіО
      # ⚠ Два написання навмисно: на Commons файли того самого архіву лежать і
      # під «ДАВіО», і під «ДАВО». Пошук за одним написанням мовчки втрачає
      # половину, а нуль у відповідь читається як «сканів немає».
      commons: [ДАВіО, ДАВО]
    # Давні написання, якими набрано частину наявних шифр і сайдкарів. Приймати
    # їх треба, показувати — ні.
    aliases: [ДАВО, DAVO]
  DAVO:
    # 🔴 Сумісність, а не архів. `DAVO` був нашим ВНУТРІШНІМ кодом, під яким у
    # дослідницькому просторі вже лежать ключі сховища сторінок і теки сканів.
    # У пакет для інших він їхати не мусив: код, що не збігається з жодним
    # чинним скороченням, вчить писати шифру, яка не зійдеться ні з архівом, ні
    # з чужим дослідником. Тому канон перевернуто (`DAVIO` головний), а запис
    # лишається рівно для того, щоб давні ключі не осиротіли.
    # ⚠ Простір, який хоче лишитись на давньому коді, перевертає це назад
    # накладкою: `DAVO: {same_as: ""}` + `DAVIO: {same_as: DAVO}`.
    label: ДАВіО
    name: Державний архів Вінницької області
    country: UA
    same_as: DAVIO
    note: |
      Два коди на той самий архів — історична розбіжність між джерелами шифр.
      Резолвер спирається на це, коли лейбл шифри каже одне, а тека диска інше.
  DACHVO:
    label: ДАЧвО
    name: Державний архів Чернівецької області
    country: UA
  DAOO:
    label: ДАОО
    name: Державний архів Одеської області
    country: UA
  ANRM:
    label: ANRM
    name: Arhiva Naţională a Republicii Moldova
    country: MD
    # Кирилицею архів набирають і «АНРМ», і «НАМ» — обидва написання трапляються
    # в наших же нотатках, і обидва мусять вести в один код.
    aliases: [АНРМ, НАМ]
  BNRM:
    label: BNRM
    name: Biblioteca Naţională a Republicii Moldova
    country: MD

  DAZHO:
    label: ДАЖО
    name: Державний архів Житомирської області
    country: UA
  DACHO:
    label: ДАЧО
    name: Державний архів Чернігівської області
    country: UA
    # 🔴 Канонічне скорочення цього архіву — «ДАЧгО» (так він стоїть у переліку
    # архівів України), але код і мітка тут уже несуть «ДАЧО»: під ним лежать
    # ключі сховища сторінок. Перейменування коштувало б міграції всіх ключів
    # заради косметики, тож канонічне написання приймається псевдонімом —
    # шифра, набрана «ДАЧгО 1462-1-24», розпізнається й веде сюди ж.
    aliases: [ДАЧгО]
  CSAMM:
    label: CSAMM
    name: Chişinău State Archive of Moldova (мікрофільми)
    country: MD
  KOSTEL:
    label: костел
    # ⚠ Не архів, а колекція метрик костелу М'ястківки (насправді ДАЖО ф.685).
    # Лишається окремим кодом, бо на нього вже зав'язані ключі сховища
    # сторінок; перекодування в DAZHO/685 — рішення дослідника, а не побічний
    # ефект збірки.
    name: Метрики костелу М'ястківки
    country: UA

  # ── решта обласних архівів України ──────────────────────────────────────────
  # 🔴 Скорочення звірені по переліку архівів України (категорія «Архіви
  # України», 53 сторінки), а не виведені з назви області. Там, де дві області
  # ділять перші літери, розрізняє їх додаткова літера В СЕРЕДИНІ коду, і вона
  # в кожній парі своя: Дніпропетровська/Донецька — ДАДнО/ДАДоО,
  # Закарпатська/Запорізька — ДАЗкО/ДАЗпО, Харківська/Херсонська — ДАХО/ДАХеО,
  # Львівська/Луганська — ДАЛО/ДАЛуО, Київська/Кіровоградська — ДАКО/ДАКрО,
  # Вінницька/Волинська — ДАВіО/ДАВоО, Чернівецька/Чернігівська — ДАЧвО/ДАЧгО.
  # Вгадати цю літеру не можна: пара на пару вона різна.
  DAARK: {label: ДААРК, name: Державний архів в Автономній Республіці Крим, country: UA}
  DAVOO:
    label: ДАВоО
    name: Державний архів Волинської області
    country: UA
    # 🔴 Найдорожчий запис у цьому блоці, і саме тому він тут не останній.
    # «ДАВО» без уточнювальної літери в наших даних уже означає ВІННИЦЬКУ
    # (`DAVIO`, під ним лежить увесь матеріал ф.904 і ф.792). Волинська справа,
    # набрана як «ДАВО», не падає з «невідомий архів» — вона мовчки лягає у
    # вінницький архів, тобто помилка не видима взагалі. Розрізняє їх лише
    # повне написання, тож псевдонімом «ДАВО» сюди НЕ додається.
  DADNO: {label: ДАДнО, name: Державний архів Дніпропетровської області, country: UA}
  DADOO: {label: ДАДоО, name: Державний архів Донецької області, country: UA}
  DAZKO: {label: ДАЗкО, name: Державний архів Закарпатської області, country: UA}
  DAZPO: {label: ДАЗпО, name: Державний архів Запорізької області, country: UA}
  DAIFO: {label: ДАІФО, name: Державний архів Івано-Франківської області, country: UA}
  DAK: {label: ДАК, name: Державний архів міста Києва, country: UA}
  DAKO: {label: ДАКО, name: Державний архів Київської області, country: UA}
  DAKRO: {label: ДАКрО, name: Державний архів Кіровоградської області, country: UA}
  DALO: {label: ДАЛО, name: Державний архів Львівської області, country: UA}
  DALUO: {label: ДАЛуО, name: Державний архів Луганської області, country: UA}
  DAMO: {label: ДАМО, name: Державний архів Миколаївської області, country: UA}
  DAPO: {label: ДАПО, name: Державний архів Полтавської області, country: UA}
  DARO: {label: ДАРО, name: Державний архів Рівненської області, country: UA}
  DAS: {label: ДАС, name: Державний архів міста Севастополя, country: UA}
  DASO: {label: ДАСО, name: Державний архів Сумської області, country: UA}
  DATO: {label: ДАТО, name: Державний архів Тернопільської області, country: UA}
  DAHO: {label: ДАХО, name: Державний архів Харківської області, country: UA}
  DAHEO: {label: ДАХеО, name: Державний архів Херсонської області, country: UA}
  DACHKO:
    label: ДАЧкО
    name: Державний архів Черкаської області
    country: UA
    note: |
      Сюди належать справи Золотоніського повіту (Полтавська губернія за
      старим поділом) — саме через нього архів і знадобився першим.

  # ── центральні ──────────────────────────────────────────────────────────────
  CDIAL: {label: ЦДІАЛ, name: "Центральний державний історичний архів України, м. Львів", country: UA}
  CDAVO: {label: ЦДАВО, name: Центральний державний архів вищих органів влади та управління України, country: UA}
  CDAHOU: {label: ЦДАГОУ, name: Центральний державний архів громадських об'єднань та україніки, country: UA}

# ── фонди: правила, що залежать від конкретного фонду ────────────────────────
fonds:
  - repo: DAHMO
    fond: "315"
    name: Подільська духовна консисторія
    guberniya: Подільська
    default_opys: "1"

  - repo: DAHMO
    fond: "226"
    name: Подільська казенна палата
    guberniya: Подільська

  - repo: DAHMO
    fond: "196"
    name: Подільська палата цивільного суду
    guberniya: Подільська

  - repo: DAHMO
    fond: "230"
    name: Подільське дворянське депутатське зібрання
    guberniya: Подільська
    # Од.зб. за офіційним путівником архіву — для звірки з розрахунком реєстру.
    guide_total: 7925
    # 🔴 Останні номери справ за шапкою фонду на Вікіджерелах. Це ЗНАМЕННИК
    # покриття; без нього частка не рахується взагалі.
    # ⚠ Порядок описів тут значущий: покриття пишеться в порядку ітерації.
    opys_last:
      "1": {last: 7438, basis: header}
      "2": {last: 320,  basis: header}
      "3": {last: 144,  basis: header}
      "4": {last: 4,    basis: header}
      "5": {last: 93,   basis: header}

  - repo: DAVIO
    fond: "904"
    name: Метричні книги церков Подільської губернії
    guberniya: Подільська

  - repo: DAVIO
    fond: "792"
    name: Нотаріальні книги (Ольгопільський повіт)
    guberniya: Подільська

  - repo: CDIAK
    fond: "224"
    name: Колекція метричних книг
    default_opys: "1"
    # 🔴 Номер фонду НА САЙТІ переглядача — факт про сайт, не про архів. Сайт
    # адресує фонд власним номером (ця ф.224 значиться там фондом 198), і без
    # нього збирач ARCHIUM не має з чого почати. Знайдене один раз однакове для
    # всіх, тож лежить тут, а не в теці кожного простору.
    # ⚠ Сайдкар `archium_fond.json` сильніший: якщо переглядач перебудують,
    # правити доведеться там, а не чекати нової версії пакета.
    archium_fond: "198"
    archium_opys:
      "1": "1527"
      "2": "1528"
      "3": "1529"
    opys_last:
      # 🔴 Оп.1 звірений із ОФІЦІЙНИМ переліком архіву
      # (cdiak.archives.gov.ua/spysok_fondiv/0224/0001/): там 1526 рядків і ті
      # самі номери 1…1515, тобто транскрипція Вікіджерел ПОВНА, а не
      # вибіркова. Рідкісний випадок — і саме тому це число можна брати за
      # знаменник без застережень.
      "1": {last: 1515, basis: official,
            note: "звірено з переліком архіву; транскрипція повна"}
      # ⚠ Оп.2 і оп.3 офіційно онлайн НЕ виставлені (сторінка оп.2 порожня,
      # оп.3 віддає 404), тож їхні межі — максимум транскрипції, тобто НИЖНЯ
      # оцінка: покриття по них завищене й зростатиме лише вниз.
      "2": {last: 231,  basis: transcript}
      "3": {last: 1183, basis: transcript}

  - repo: CDIAK
    fond: "481"
    name: Подільська духовна консисторія
    # ⚠ Губернії тут навмисно немає: фонд потрапив у пак заради МЕЖ ОПИСІВ, а
    # зріз по губернії — окреме знання. Дописати його принагідно означало б
    # змішати дві зміни в одній, і ворота дослівної звірки з чинними
    # константами перестали б бути дослівними.
    guide_total: 3979
    # ⚠ Описи цього фонду рукописні й ніде не оцифровані, тож межі — з шапки
    # фонду на Вікіджерелах і з максимумів чужої транскрипції. Обидва джерела
    # дають НИЖНЮ оцінку.
    opys_last:
      "1": {last: 293,  basis: transcript}
      "2": {last: 2384, basis: transcript}
      "3": {last: 1286, basis: transcript}

  - repo: CDIAK
    fond: "127"
    default_opys: "1076"

  - repo: CDIAK
    fond: "1125"
    archium_fond: "695"
    archium_opys:
      "1": "2217"

  - repo: ANRM
    fond: "211"
    name: Кишинівська духовна консисторія
    opys_in_key: true
    note: |
      🔴 Опис ОБОВ'ЯЗКОВО входить у ключ справи: нумерація починається з одиниці
      в КОЖНОМУ описі, тож без опису різні книги злипаються в одну.
      оп.1/3 — метрики, оп.5 — метрики сільських церков, оп.11 — сповідні розписи;
      усі мають справи з малими номерами.
      Ціна помилки: аркуші однієї книги мовчки дописувались би в іншу.

# ── теки, що НЕ містять архівних справ ───────────────────────────────────────
# Описи фондів, OCR-корпуси, періодика за роками — навіть якщо їхні імена
# схожі на шифри справ.
skip_slugs:
  - davo_opysy
  - dahmo_319_f65_opisy
  - bev_pdh
  - kev_pdh
  - khev_pdh
  - eev_pdh
  - _console_pages

# ── підписи типів документів ─────────────────────────────────────────────────
record_type_labels:
  birth: народження
  marriage: шлюби
  death: смерті
  confession: сповідні
  revision: ревізькі
  gazette: єпарх. відомості
  clergy_list: клірові
  finding_aid: опис фонду
  other: інше
